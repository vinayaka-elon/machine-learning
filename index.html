<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Machines</title>
<meta name="description" content="An interactive machine learning lecture for business and analytics students.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#73000a; --red:#a6192e; --gold:#b59a57; --gold-deep:#8a7239; --gold-soft:#f8f3e7;
  --ink:#1d1d1f; --ink-2:#3a3a3c; --grey:#6a6a70; --grey-2:#95959b;
  --line:#e6e6ea; --muted:#d4d4d9;
  --bg:#ffffff; --card-2:#fafaf9;
  --accent:#a6192e; --accent-soft:#fbeced;
  --ok:#2f7d4f; --ok-soft:#eaf5ee; --bad:#a6192e;
  --blue:#1f5f8b; --blue-soft:#e8f1f7; --plum:#6b4a8a;
  --shadow-s:0 1px 2px rgba(0,0,0,.04), 0 3px 12px rgba(0,0,0,.045);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:"Commissioner",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;color:inherit}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:.06em .4em}
svg{display:block;max-width:100%}
canvas{display:block;max-width:100%}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--line);background:#fff}
.mastin{max-width:980px;margin:0 auto;padding:30px 24px 0}
.mast .brand{display:flex;align-items:center;gap:11px;font-weight:600;letter-spacing:-.01em;font-size:17px;color:var(--ink)}
.mast .brand:hover{text-decoration:none}
.mark{width:30px;height:30px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;box-shadow:inset 0 -3px 0 var(--gold)}
.mast h1{font-size:clamp(31px,4.6vw,46px);line-height:1.06;letter-spacing:-.035em;font-weight:600;margin:20px 0 10px;max-width:760px}
.mast h1 em{font-style:normal;color:var(--maroon)}
.mast .lede{font-size:18px;color:var(--grey);max-width:680px;margin:0 0 22px;line-height:1.5}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-size:15.5px;color:var(--grey);padding:11px 15px 13px;white-space:nowrap;border-bottom:2.5px solid transparent;font-weight:500}
nav.tabs a:hover{text-decoration:none;color:var(--ink)}
nav.tabs a.on{color:var(--maroon);border-bottom-color:var(--maroon);font-weight:600}
.stick{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.stickin{max-width:980px;margin:0 auto;padding:0 24px}

main{max-width:980px;margin:0 auto;padding:4px 24px 90px}

/* ---------- vertical sections ---------- */
section.part{padding:46px 0 10px;border-top:1px solid var(--line)}
section.part:first-of-type{border-top:none;padding-top:38px}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 9px}
h2.pt{font-size:clamp(26px,3.4vw,36px);line-height:1.1;letter-spacing:-.032em;font-weight:600;margin:0 0 12px}
p.ptlede{font-size:18px;color:var(--grey);margin:0 0 26px;line-height:1.5;max-width:720px}
.blk{margin:0 0 30px}
.q{font-size:21px;line-height:1.3;letter-spacing:-.016em;font-weight:600;margin:30px 0 10px}
.blk>.q:first-child{margin-top:0}
p{margin:0 0 14px}
.muted{color:var(--grey)}
.note{background:var(--gold-soft);border-radius:12px;padding:13px 17px;margin:16px 0;font-size:15.8px;color:var(--ink-2);border-left:4px solid var(--gold);line-height:1.52}
.note.red{background:var(--accent-soft);border-left-color:var(--red)}
.note.blue{background:var(--blue-soft);border-left-color:var(--blue)}
.note.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.note b{color:var(--ink)}
.tonext{display:flex;justify-content:flex-end;margin:46px 0 0;padding-top:26px;border-top:1px solid var(--line)}

/* ---------- figures ---------- */
.fig{margin:18px 0;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px}
.fig .figc{overflow-x:auto}
.fctl{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}
.vb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:13.8px;cursor:pointer;color:var(--ink-2);transition:border-color .15s,background .15s}
.vb:hover{border-color:var(--maroon);color:var(--maroon)}
.vb.main{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.vb.main:hover{background:var(--red)}
.vb.on{background:var(--accent-soft);border-color:var(--red);color:var(--maroon);font-weight:600}
.vb:disabled{opacity:.38;cursor:default}
.fk{font-size:13px;color:var(--grey);margin-left:2px}
figcaption{font-size:14px;color:var(--grey);margin-top:10px;line-height:1.5}
figcaption b{color:var(--ink-2)}
.ctrl{margin:9px 0}
.ctrl label{display:flex;justify-content:space-between;font-size:13.5px;color:var(--grey);margin-bottom:1px;gap:10px}
.ctrl label output,.ctrl label span.o{color:var(--maroon);font-weight:700;font-variant-numeric:tabular-nums}
.ctrl input[type=range]{width:100%;accent-color:var(--maroon)}
.ctrl .hint{font-size:12.8px;color:var(--grey-2);line-height:1.4}
input[type=range]{accent-color:var(--maroon)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.stats>div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 12px;font-size:12.6px;color:var(--grey);min-width:98px}
.stats>div b{display:block;font-size:18.5px;color:var(--ink);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats>div.hl b{color:var(--maroon)}
.eqn{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:16.5px;text-align:center;overflow-x:auto}
.eqn .v{color:var(--maroon);font-weight:700}
.eqn small{display:block;font-size:13.5px;color:var(--grey);margin-top:6px;text-align:left}

/* ---------- tables ---------- */
.tb{width:100%;border-collapse:collapse;font-size:14.8px;margin:14px 0}
.tb th{text-align:left;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-deep);padding:8px 10px;border-bottom:2px solid var(--line);vertical-align:bottom}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.46}
.tb tr:last-child td{border-bottom:none}
.tb tbody tr:hover{background:var(--card-2)}
.tb td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tb .nm{font-weight:600;white-space:nowrap}
.tbw{overflow-x:auto;margin:14px 0}
.tbw .tb{margin:0;min-width:600px}
@media(max-width:700px){.tbw .tb{min-width:540px}}

/* ---------- quiz ---------- */
.qz{margin:8px 0 0}
.qq{border-top:1px solid var(--line);padding:16px 0 4px}
.qq:first-child{border-top:none;padding-top:4px}
.qt{font-weight:600;margin:0 0 10px;font-size:16.5px;line-height:1.4}
.cs{display:grid;gap:8px}
.ch{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 15px;cursor:pointer;font-size:15.3px;text-align:left;line-height:1.42;transition:border-color .15s,background .15s}
.ch:hover{border-color:var(--grey-2)}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--bad);background:var(--accent-soft)}
.why{display:none;font-size:14.8px;color:var(--ink-2);margin-top:9px;line-height:1.5}
.why.show{display:block}
.why b{color:var(--ink)}

/* ---------- sorting ---------- */
.sortg{display:grid;gap:10px;margin:8px 0}
.sr{border:1px solid var(--line);border-radius:13px;padding:12px 15px;background:#fff}
.srt{font-size:15.5px;font-weight:500;margin-bottom:9px;line-height:1.4}
.srb{display:flex;gap:6px;flex-wrap:wrap}
.srb .vb.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.srb .vb.bad{background:var(--accent-soft);border-color:var(--bad);color:var(--bad)}
.sre{font-size:14.3px;color:var(--ink-2);margin-top:8px;line-height:1.5;display:none}
.sre.show{display:block}

/* ---------- learning-type explorer ---------- */
.lt-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lt-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:14.3px;cursor:pointer;color:var(--grey);transition:all .15s}
.lt-tabs button:hover{border-color:var(--grey-2);color:var(--ink)}
.lt-tabs button.on{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:600}
.lt-body{border:1px solid var(--line);border-radius:15px;background:var(--card-2);padding:18px 20px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.lt-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.lt-head h4{margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600}
.lt-head span{font-size:13.5px;color:var(--gold-deep);font-weight:600}
.lt-kv{display:grid;grid-template-columns:132px 1fr;gap:4px 14px;font-size:14.8px;margin:12px 0 4px}
.lt-kv dt{color:var(--grey);font-weight:500}
.lt-kv dd{margin:0;color:var(--ink-2)}

/* ---------- sources ---------- */
.srcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
.src{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:13px;padding:13px 15px;background:#fff;color:var(--ink)}
.src:hover{text-decoration:none;border-color:var(--muted);box-shadow:var(--shadow-s)}
.sk{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gold-deep)}
.src b{font-size:15.2px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.sw{font-size:13px;color:var(--grey)}
.sd{font-size:13.3px;color:var(--grey-2);line-height:1.42;margin-top:2px}

/* ---------- RL car lab ---------- */
.lab{margin:18px 0 0}
.labcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.labcard>h5{margin:0 0 10px;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.labcard>h5 small{font-weight:500;color:var(--grey-2);font-size:12.5px}
#track{width:100%;height:auto;border-radius:11px;background:#5f7f52}
.labgroup{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--grey-2);margin:12px 0 5px}
.labgroup:first-child{margin-top:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0;color:var(--ink-2)}
.chk input{accent-color:var(--maroon)}
.legend{display:flex;gap:14px;font-size:12.8px;color:var(--grey);flex-wrap:wrap;margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.raybar{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:5px}
.raybar .nm{width:78px;color:var(--grey)}
.raybar .tr{flex:1;height:11px;background:#f0f0f3;border-radius:6px;overflow:hidden}
.raybar .fl{height:11px;border-radius:6px}
.raybar .bn{width:38px;text-align:right;font-weight:700;font-size:12.5px}
.qbar{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:6px}
.qbar .nm{width:96px}
.qbar .tr{flex:1;height:17px;background:#f0f0f3;border-radius:6px;position:relative}
.qbar .fl{position:absolute;top:0;height:17px;border-radius:6px}
.qbar .vv{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.eq{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.6px;line-height:1.62;overflow-x:auto}
.eq .v{color:var(--maroon);font-weight:700}
.labnote{font-size:12.8px;color:var(--grey-2);margin:6px 0 0;line-height:1.45}
details.adv{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px}
details.adv>summary{cursor:pointer;padding:13px 16px;font-weight:600;font-size:15px;list-style:none;color:var(--ink)}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"+ ";color:var(--maroon);font-weight:700}
details.adv[open]>summary::before{content:"− "}
details.adv .in{padding:0 16px 16px}
#tip{position:fixed;pointer-events:none;background:#1d1d1f;color:#fff;font-size:12.5px;padding:8px 10px;border-radius:8px;display:none;z-index:90;max-width:250px;line-height:1.45}
ol.try{padding-left:20px;margin:0}
ol.try li{margin-bottom:10px;line-height:1.5}
.rules{width:100%;border-collapse:collapse;font-size:14px}
.rules td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.rules td:first-child{font-weight:700;width:92px;color:var(--grey)}
.rules tr:last-child td{border-bottom:none}

@media(max-width:700px){
  .mastin,.stickin,main{padding-left:16px;padding-right:16px}
  nav.tabs a{font-size:14.5px;padding:10px 11px 12px}
  .lt-kv{grid-template-columns:1fr;gap:1px 0}
  .lt-kv dt{margin-top:8px;font-size:12.5px;color:var(--gold-deep);font-weight:700}
  .fig{padding:11px 11px 10px}
  section.part{padding-top:36px}
}
</style>
</head>
<body>
<header class="mast">
  <div class="mastin">
    <a class="brand" href="#/basics"><span class="mark">LM</span>Learning Machines</a>
    <h1>Machine learning, <em>from data to decisions.</em></h1>
    <p class="lede">Four parts, read top to bottom. Every model fits in your browser and every figure moves one step at a time.</p>
  </div>
</header>
<div class="stick"><div class="stickin"><nav class="tabs" id="tabs"></nav></div></div>
<main id="main"></main>
<div id="tip"></div>
<script>
"use strict";
/* ============ tiny helpers ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(v,d=2)=>(Math.abs(v)<1e-9?0:v).toFixed(d);
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
function corr(a,b){const ma=mean(a),mb=mean(b);let n=0,da=0,db=0;for(let i=0;i<a.length;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return n/Math.sqrt(da*db)}

/* ============ svg builders ============ */
const SV=(w,h,inner,cls='')=>`<svg viewBox="0 0 ${w} ${h}" class="${cls}" style="width:100%;height:auto">${inner}</svg>`;
const R=(x,y,w,h,f,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r||0}" fill="${f}"${o.s?` stroke="${o.s}" stroke-width="${o.sw||1}"`:''}${o.op?` opacity="${o.op}"`:''}/>`;
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'start'}" font-size="${o.fs||13}" font-weight="${o.w||400}" fill="${o.c||'var(--ink-2)'}"${o.ff?` font-family="${o.ff}"`:''}${o.op?` opacity="${o.op}"`:''}>${t}</text>`;
const L=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||'var(--line)'}" stroke-width="${o.w||1}"${o.d?` stroke-dasharray="${o.d}"`:''}${o.op?` opacity="${o.op}"`:''}/>`;
const C=(x,y,r,f,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${o.s?` stroke="${o.s}" stroke-width="${o.sw||1.5}"`:''}${o.op?` opacity="${o.op}"`:''}/>`;
const PATH=(d,o={})=>`<path d="${d}" fill="${o.f||'none'}" stroke="${o.c||'var(--maroon)'}" stroke-width="${o.w||2}"${o.d?` stroke-dasharray="${o.d}"`:''}${o.op?` opacity="${o.op}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
let AID=0;
function ARW(x1,y1,x2,y2,c='#95959b'){const id='ah'+(AID++);return `<defs><marker id="${id}" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="${c}"/></marker></defs><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2" marker-end="url(#${id})"/>`}
const BX=(x,y,w,h,lines,fill,col='#fff',fs=13)=>R(x,y,w,h,fill,{r:12})+lines.map((l,i)=>T(x+w/2,y+h/2+5+(i-(lines.length-1)/2)*17,l,{a:'middle',fs,w:600,c:col})).join('');

/* axes helper: returns {X,Y,frame} */
function axes(w,h,pad,xd,yd,xl,yl,o={}){
  const X=v=>pad.l+(v-xd[0])/(xd[1]-xd[0])*(w-pad.l-pad.r);
  const Y=v=>h-pad.b-(v-yd[0])/(yd[1]-yd[0])*(h-pad.t-pad.b);
  let g='';
  const nx=o.nx||5, ny=o.ny||4;
  for(let i=0;i<=nx;i++){const v=xd[0]+(xd[1]-xd[0])*i/nx;g+=L(X(v),pad.t,X(v),h-pad.b,{c:'#eeeef1'})+T(X(v),h-pad.b+17,o.xf?o.xf(v):fmt(v,0),{a:'middle',fs:11.5,c:'var(--grey-2)'})}
  for(let i=0;i<=ny;i++){const v=yd[0]+(yd[1]-yd[0])*i/ny;g+=L(pad.l,Y(v),w-pad.r,Y(v),{c:'#eeeef1'})+T(pad.l-7,Y(v)+4,o.yf?o.yf(v):fmt(v,0),{a:'end',fs:11.5,c:'var(--grey-2)'})}
  g+=L(pad.l,pad.t,pad.l,h-pad.b,{c:'#c9c9ce'})+L(pad.l,h-pad.b,w-pad.r,h-pad.b,{c:'#c9c9ce'});
  g+=T((pad.l+w-pad.r)/2,h-3,xl,{a:'middle',fs:12.5,w:600,c:'var(--grey)'});
  g+=`<text x="${12}" y="${(pad.t+h-pad.b)/2}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--grey)" transform="rotate(-90 12 ${(pad.t+h-pad.b)/2})">${yl}</text>`;
  return {X,Y,frame:g};
}

/* ============ regression maths ============ */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let p=i;for(let j=i+1;j<n;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];const d=A[i][i]||1e-12;for(let j=i+1;j<n;j++){const f=A[j][i]/d;for(let k=i;k<n;k++)A[j][k]-=f*A[i][k];b[j]-=f*b[i]}}
  const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let k=i+1;k<n;k++)s-=A[i][k]*x[k];x[i]=s/(A[i][i]||1e-12)}return x}
function ols(X,y,lam=0){
  const n=X.length,p=X[0].length+1,Z=X.map(x=>[1,...x]);
  const A=[...Array(p)].map((_,i)=>[...Array(p)].map((_,j)=>Z.reduce((a,z)=>a+z[i]*z[j],0)+(i===j&&i>0?lam:0)));
  const b=[...Array(p)].map((_,i)=>Z.reduce((a,z,k)=>a+z[i]*y[k],0));
  const beta=solve(A.map(r=>[...r]),[...b]);
  const fit=Z.map(z=>z.reduce((a,v,i)=>a+v*beta[i],0));
  const rss=fit.reduce((a,f,i)=>a+(y[i]-f)**2,0),my=mean(y),tss=y.reduce((a,v)=>a+(v-my)**2,0);
  const s2=rss/Math.max(1,n-p);
  const se=[...Array(p)].map((_,j)=>{const e=Array(p).fill(0);e[j]=1;const col=solve(A.map(r=>[...r]),e);return Math.sqrt(Math.max(0,s2*col[j]))});
  return {beta,se,rss,r2:1-rss/tss,ar2:1-(rss/Math.max(1,n-p))/(tss/(n-1)),fit,
          pred:x=>[1,...x].reduce((a,v,i)=>a+v*beta[i],0),
          t:beta.map((b,i)=>se[i]?b/se[i]:0)};
}
function lasso(X,y,lam,iter=400){ /* coordinate descent on standardized X */
  const n=X.length,p=X[0].length;const mu=[...Array(p)].map((_,j)=>mean(X.map(r=>r[j])));
  const s=[...Array(p)].map((_,j)=>sd(X.map(r=>r[j]))||1);
  const Z=X.map(r=>r.map((v,j)=>(v-mu[j])/s[j]));const my=mean(y),yc=y.map(v=>v-my);
  let b=Array(p).fill(0);
  for(let it=0;it<iter;it++)for(let j=0;j<p;j++){
    let rho=0,zz=0;for(let i=0;i<n;i++){let pr=0;for(let k=0;k<p;k++)if(k!==j)pr+=Z[i][k]*b[k];rho+=Z[i][j]*(yc[i]-pr);zz+=Z[i][j]**2}
    const th=lam*n/2;b[j]=Math.sign(rho)*Math.max(0,Math.abs(rho)-th)/zz;
  }
  return {bz:b, beta:b.map((v,j)=>v/s[j]), mu, s, my};
}

function catmull(ctrl,per){var out=[],n=ctrl.length;for(var i=0;i<n;i++){var p0=ctrl[(i-1+n)%n],p1=ctrl[i],p2=ctrl[(i+1)%n],p3=ctrl[(i+2)%n];
  for(var k=0;k<per;k++){var t=k/per,t2=t*t,t3=t2*t;out.push([0,1].map(function(c){return 0.5*((2*p1[c])+(-p0[c]+p2[c])*t+(2*p0[c]-5*p1[c]+4*p2[c]-p3[c])*t2+(-p0[c]+3*p1[c]-3*p2[c]+p3[c])*t3);}));}}return out;}

function resample(pts,step){var out=[pts[0]],n=pts.length,carry=0;for(var i=0;i<n;i++){var a=pts[i],b=pts[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),d=step-carry;

   ['Prompt it — no training at all','Add retrieval — feed it your documents','Fine-tune — small weight updates, often LoRA','Train from scratch — rare, and expensive'].forEach((t,i)=>
     s+=T(36+(i%2)*300,204+Math.floor(i/2)*20,(i+1)+'. '+t,{fs:12.5,c:'var(--ink-2)'}))}
  return SV(w,k>=2?250:152,s)},{label:k=>['pretrained once','freeze and swap the head','the adaptation ladder'][k]});
}

const ICX=[['The app logged me out and will not let me back in','Account access'],

function demoIC(el){
 el.innerHTML=pfig('f2ic','<b>In-context.</b> Three examples typed into the prompt, no training, no gradient, no weights changed. The model picks up the task from the prompt itself.',
  `<div class="row" style="margin-top:10px"><button class="vb main" id="icGo">Classify the next ticket</button><button class="vb" id="icReset">Start over</button></div>`);
 let n=3;

  s+=T(28,54,'Sort each support ticket into a category.',{fs:13,w:600,c:'var(--ink-2)'});
  ICX.slice(0,rows).forEach((t,i)=>{const y=76+i*34,given=i<3;
   s+=`<foreignObject x="28" y="${y-14}" width="430" height="30"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 13px Commissioner,sans-serif;color:#6a6a70">“${t[0]}”</div></foreignObject>`;
   s+=T(470,y+2,'→',{fs:13,c:'var(--grey-2)'});
   s+=R(490,y-12,124,24,given?'#f8f3e7':'#eaf5ee',{r:8,s:given?'#e0d4b4':'#b7ddc5'});
   s+=T(552,y+4,t[1],{a:'middle',fs:12,w:700,c:given?'#8a7239':'#2f7d4f'});
   if(!given)s+=T(620,y+4,'✓',{a:'end',fs:13,w:700,c:'#2f7d4f'})});
  const y0=48+rows*34+40;
  s+=T(16,y0,n<=3?'Three examples given. The model has never been trained on your categories.':
    'The green rows are the model\'s own answers. Nothing about the model changed.',{fs:12.5,w:600,c:n<=3?'var(--grey)':'#2f7d4f'});
  s+=T(16,y0+20,'Weights updated: 0. Training runs: 0. Labelled data collected: 3.',{fs:12.5,c:'var(--grey-2)'});

 $('icGo').onclick=()=>{n=Math.min(ICX.length,n+1);draw()};
 $('icReset').onclick=()=>{n=3;draw()};

}

 {html:()=>`<p class="q">One table, three jobs.</p>

     A:'<b>60 rows, 6 columns.</b> One row is one shop. Every model in this lecture reads a table shaped exactly like this one.',

 {html:()=>`<p class="q">Not every column is a number, and not every number is a quantity.</p>
  <table class="tb"><thead><tr><th>Kind of column</th><th>Example here</th><th>What you do with it</th></tr></thead><tbody>
  <tr><td class="nm">Numeric</td><td>ad spend, foot traffic, seats</td><td>Use as is. A one-unit change means the same thing everywhere on the scale.</td></tr>
  <tr><td class="nm">Ordinal</td><td>a 1-to-5 quality tier, a satisfaction band</td><td>Encode in order. One-hot encoding throws the order away, which is information you paid for.</td></tr>
  <tr><td class="nm">Unordered category</td><td>region, store format, carrier</td><td>One-hot encode. Every coefficient is then read against whichever level you left out.</td></tr>
  <tr><td class="nm">Binary</td><td>franchised, codeshare, member</td><td>0 and 1. The coefficient is the gap between the two groups.</td></tr>
  <tr><td class="nm">Text or date</td><td>a review, an admission timestamp</td><td>Not usable raw. Turn into features first: length, sentiment, day of week, days since.</td></tr>
  </tbody></table>
  <div class="note red"><b>A number is not automatically a quantity.</b> Zip code 27244 is not three times zip code 9081. Patient ID, store number, and survey codes look numeric and mean nothing numerically. Feeding one to a regression is a real and common mistake.</div>`},
 {html:()=>`<p class="q">Hide some of your data from yourself, on purpose.</p>

function polyFit(pts,deg){const X=pts.map(p=>[...Array(deg)].map((_,j)=>p[0]**(j+1)));return ols(X,pts.map(p=>p[1]))}
const polyErr=(m,pts,deg)=>pts.reduce((a,p)=>a+Math.abs(m.pred([...Array(deg)].map((_,j)=>p[0]**(j+1)))-p[1]),0);
const F4BEST=Math.min(...[...Array(9)].map((_,i)=>{const d=i+1;return polyErr(polyFit(TRUCK.tr,d),TRUCK.te,d)}));
E.f4={id:'f4',nav:'Fitting',title:'Fitting and overfitting',
 short:'Why the model that fits your data best is usually not the model you want, and how train-test error pulls apart.',
 lead:'Give a model enough freedom and it will pass through every point you own. That is not learning; it is memorising, and it falls apart on the very next observation. This lesson is the single most important idea in the lecture, and it has one picture.',
 learn:[
 {tag:'play',tagl:'Explore',
  html:()=>`<p class="q">A food truck, ten weeks, and one slider.</p>
  <p>A food truck charged a different price for its signature sandwich each week for ten weeks and recorded the profit. Your job is to draw the relationship. Move the slider to let the curve bend more. Watch the two error numbers move in opposite directions.</p>
  ${pfig('f4fit','<b>Figure.</b> Grey dots are the ten weeks the curve was fitted on. Blue diamonds are ten later weeks the curve has never seen. Synthetic data with a real inverted-U underneath.',
   sl('f4d','How much the curve may bend',1,9,1,1,'1 = a straight line. 9 = a curve flexible enough to pass through all ten training points.')+`<div class="stats" id="f4stat"></div>`)}
  <div id="f4say" class="note"></div>`,
  init:()=>{const draw=()=>{
   const deg=+$('f4d').value;$('f4do').textContent=deg===1?'straight line':deg+' bends allowed';
   const m=polyFit(TRUCK.tr,deg);
   const etr=polyErr(m,TRUCK.tr,deg),ete=polyErr(m,TRUCK.te,deg);
   const w=640,h=330,pad={l:58,r:14,t:14,b:38};
   const A=axes(w,h,pad,[3.5,14],[10,55],'Sandwich price ($)','Weekly profit ($100s)',{xf:v=>'$'+v.toFixed(0)});
   let s=A.frame,d='';
   for(let i=0;i<=200;i++){const x=3.6+i/200*10.3;
    const y=clamp(m.pred([...Array(deg)].map((_,j)=>x**(j+1))),-200,300);
    d+=(i?'L':'M')+A.X(x)+','+A.Y(y)}
   s+=`<clipPath id="f4clip"><rect x="${pad.l}" y="${pad.t}" width="${w-pad.l-pad.r}" height="${h-pad.t-pad.b}"/></clipPath><g clip-path="url(#f4clip)">${PATH(d,{c:'#73000a',w:2.6})}</g>`;
   TRUCK.tr.forEach(p=>{s+=C(A.X(p[0]),A.Y(p[1]),5,'#95959b',{s:'#fff',sw:1.5})});
   TRUCK.te.forEach(p=>{const x=A.X(p[0]),y=A.Y(p[1]);s+=`<path d="M${x-5.4},${y} L${x},${y-5.4} L${x+5.4},${y} L${x},${y+5.4} Z" fill="#1f5f8b" stroke="#fff" stroke-width="1.5"/>`});
   s+=T(w-pad.r,pad.t+14,'● fitted on these   ◆ never seen',{a:'end',fs:12,c:'var(--grey-2)'});
   $('f4fit').innerHTML=SV(w,h+6,s);
   $('f4stat').innerHTML=`<div><b>${etr.toFixed(0)}</b>error on the ten it fitted</div><div class="hl"><b>${ete.toFixed(0)}</b>error on the ten it has not seen</div><div><b>${F4BEST.toFixed(0)}</b>best any curve managed on new weeks</div>`;
   const note=$('f4say');
   if(deg===1){note.className='note';note.innerHTML='<b>Underfitting.</b> A straight line physically cannot say "profit peaks at a middle price", and the real relationship does exactly that. It was wrong before it saw any data. That built-in wrongness is called <b>bias</b>.'}
   else if(deg<=3){note.className='note';note.style.cssText='background:#eaf5ee;border-left-color:#2f7d4f';note.innerHTML='<b>About right.</b> Enough flexibility to capture the peak, not enough to chase the noise. Both errors are low and close together, which is what you are actually looking for.'}
   else if(deg<=6){note.className='note';note.style.cssText='';note.innerHTML='<b>Starting to chase noise.</b> The training error keeps falling, which feels like progress. The test error has already turned around. Only one of those two numbers is telling you the truth.'}
   else{note.className='note red';note.style.cssText='';note.innerHTML='<b>Overfitting.</b> The curve now passes through nearly every training point — training error near zero — and is wild between them. It has memorised ten weeks of random wobble that will never repeat. Notice what happens just past $13, half a dollar beyond the data: the curve falls off a cliff.'}};
   bind(['f4d'],draw)}},
 {html:()=>`<p class="q">The two errors, side by side.</p>
  <p>Fit the same data at every level of flexibility and plot both errors together. Training error slides monotonically to zero. Test error comes down, bottoms out, and climbs. The gap between the two curves is overfitting, and it only becomes visible because you held data back.</p>
  ${pfig('f4curve','<b>Figure.</b> Total absolute error, ten points each. The lowest point of the blue curve is the model you want, and nothing in the red curve could have told you where it is.')}
  <div class="grid2" style="margin-top:6px">
   <div class="note" style="margin:0"><b>Bias</b> is being wrong on purpose. A straight line forced onto a curved relationship is wrong in the same direction every time you refit it, no matter how much data you give it.</div>
   <div class="note red" style="margin:0"><b>Variance</b> is being unstable. Fit a nine-bend curve to a different ten weeks and you get a wildly different curve. Fit a straight line and you get almost the same line.</div>
  </div>`,
  init:()=>{const w=640,h=300,pad={l:56,r:120,t:16,b:40};
   const tr=[],te=[];for(let d=1;d<=9;d++){const m=polyFit(TRUCK.tr,d);tr.push(polyErr(m,TRUCK.tr,d));te.push(Math.min(polyErr(m,TRUCK.te,d),120))}
   const A=axes(w,h,pad,[1,9],[0,120],'How much the curve may bend  →','Total error',{nx:8,xf:v=>v.toFixed(0)});
   let s=A.frame;
   s+=PATH(tr.map((v,i)=>(i?'L':'M')+A.X(i+1)+','+A.Y(v)).join(''),{c:'#a6192e',w:2.6});
   s+=PATH(te.map((v,i)=>(i?'L':'M')+A.X(i+1)+','+A.Y(v)).join(''),{c:'#1f5f8b',w:2.6});
   tr.forEach((v,i)=>s+=C(A.X(i+1),A.Y(v),3.6,'#a6192e'));
   te.forEach((v,i)=>s+=C(A.X(i+1),A.Y(v),3.6,'#1f5f8b'));
   const bi=te.indexOf(Math.min(...te));
   s+=L(A.X(bi+1),pad.t,A.X(bi+1),h-pad.b,{c:'#2f7d4f',w:1.6,d:'5 4'});
   s+=T(A.X(bi+1)+6,pad.t+14,'best on new data',{fs:12,w:700,c:'#2f7d4f'});
   s+=T(w-pad.r+10,A.Y(tr[8])+4,'training',{fs:12.5,w:700,c:'#a6192e'});
   s+=T(w-pad.r+10,A.Y(te[8])+4,'test',{fs:12.5,w:700,c:'#1f5f8b'});
   s+=T(w-pad.r+10,A.Y(te[8])+22,'(capped for the plot)',{fs:11,c:'var(--grey-2)'});
   s+=T(pad.l+6,A.Y(4),'underfitting ←',{fs:12,c:'var(--grey-2)'});
   $('f4curve').innerHTML=SV(w,h+4,s)}},
 {html:()=>`<p class="q">What to do about it.</p>
  <table class="tb"><thead><tr><th>Move</th><th>What it does</th><th>Cost</th></tr></thead><tbody>
  <tr><td class="nm">Hold out a test set</td><td>Makes the problem visible at all. Nothing else on this list matters without it.</td><td>You lose those rows for training.</td></tr>
  <tr><td class="nm">Cross-validation</td><td>Rotates which rows are held out, so the estimate stops depending on one lucky split.</td><td>Five to ten times the compute.</td></tr>
  <tr><td class="nm">Simplify the model</td><td>Fewer features, fewer bends. Less room to memorise.</td><td>Can tip you into underfitting.</td></tr>
  <tr><td class="nm">Regularization</td><td>Keeps the coefficients small, so no single feature can swing the prediction. Lesson 9.</td><td>Introduces a knob you have to tune.</td></tr>
  <tr><td class="nm">More data</td><td>The most reliable fix. Noise averages out; real structure does not.</td><td>Usually the thing you cannot get.</td></tr>
  </tbody></table>
  <div class="note"><b>The uncomfortable part.</b> Nobody can tell a good model from a memorised one by looking at how well it fits the data it was built on. Not you, not your professor, not a model that cost ten million dollars to train. The only move available to any of us is to hide some data from ourselves on purpose and look at it last.</div>`}],
 quiz:[
 {q:'Model A: training R² 0.99, test R² 0.41. Model B: training R² 0.68, test R² 0.64. Which would you ship?',
  o:['A, its R² is far higher','B, it performs about as well on new data as on old','Neither, both need more features'],a:1,
  why:'A has memorised. The only number that predicts future performance is the test score, and B wins on it by a wide margin while also being stable.'},
 {q:'Your test error is high and your training error is also high. What is the problem?',
  o:['Overfitting','Underfitting','Data leakage'],a:1,
  why:'Overfitting means low training error and high test error. Both high means the model is too rigid, or the features do not carry the signal. Add flexibility or better features.'},
 {q:'Why does the nine-bend curve go haywire just past the edge of the data?',
  o:['A bug in the fitting routine','High-degree polynomials are only constrained where there are points','The test points are wrong'],a:1,
  why:'Between and beyond the training points nothing holds the curve down, so it swings freely. Extrapolation is where flexible models fail first and hardest.'}],
 more:[{k:'book',t:'An introduction to statistical learning',a:'James, Witten, Hastie and Tibshirani',y:2021,u:'https://www.statlearning.com/',d:'Free PDF. Chapter 2 is the clearest treatment of bias and variance in print.'},
  {k:'explainer',t:'The bias-variance tradeoff',a:'MLU-Explain, Amazon',y:2022,u:'https://mlu-explain.github.io/bias-variance/',d:'Interactive, and it shows the same U-curve from a different angle.'},
  {k:'article',t:'A few useful things to know about machine learning',a:'Domingos, Communications of the ACM',y:2012,u:'https://doi.org/10.1145/2347736.2347755',d:'Twelve lessons from practice; overfitting is the first and longest.'}]};

/* ================= r1 — the straight line ================= */
const R1D=SHOP.slice(0,22).map(s=>[+(s.ad/1000).toFixed(2),+(s.sales/1000).toFixed(2)]);
const R1M=ols(R1D.map(p=>[p[0]]),R1D.map(p=>p[1]));
const FAM=[
 ['Simple linear','one feature, one straight line','ŷ = b₀ + b₁x','Lesson 6'],
 ['Multiple linear','several features, still straight in each','ŷ = b₀ + b₁x₁ + … + bₖxₖ','Lesson 8'],
 ['Polynomial','one feature, allowed to curve','ŷ = b₀ + b₁x + b₂x²','Lesson 9'],
 ['Log and other transforms','straight line on a changed scale','ŷ = b₀ + b₁ log x','Lesson 9'],
 ['Interaction','the effect of one feature depends on another','ŷ = b₀ + b₁x₁ + b₂x₂ + b₃x₁x₂','Lesson 9'],
 ['Ridge','keeps every feature, shrinks all coefficients','minimise RSS + λ Σ b²','Lesson 10'],
 ['Lasso','shrinks, and sets weak coefficients to exactly zero','minimise RSS + λ Σ |b|','Lesson 10']];
E.r1={id:'r1',nav:'The straight line',title:'The straight line',
 short:'Least squares from scratch: drag a line, watch the errors, then let the maths place it for you.',
 lead:'Regression is the most used idea in applied analytics and the whole family grows out of one picture: a cloud of points and a line through it. This lesson is that picture, and the one number that decides where the line goes.',
 learn:[
 {html:()=>`<p class="q">One family, seven members.</p>
  <p>Everything in this module is the same machine with different parts bolted on. It is worth seeing the whole family before meeting any member of it, because the names sound more different than the models are.</p>
  <div class="tbw"><table class="tb"><thead><tr><th>Member</th><th>What is different about it</th><th>The equation</th><th>Where</th></tr></thead><tbody>
   ${FAM.map(f=>`<tr><td class="nm" style="color:var(--maroon)">${f[0]}</td><td>${f[1]}</td><td style="font-family:ui-monospace,Menlo,monospace;font-size:13.5px;white-space:nowrap">${f[2]}</td><td style="color:var(--grey);white-space:nowrap">${f[3]}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="note"><b>Read down the equation column.</b> Every single one is a weighted sum. The features change, the penalty changes, the scale changes — the shape of the thing never does. That is why all of them fit the same way and are read the same way.</div>`},
 {tag:'play',tagl:'Explore',
  html:()=>`<p class="q">Put the line where you think it goes.</p>
  <p>Twenty-two coffee shops. Across: weekly advertising spend. Up: weekly sales. Move the two sliders until the line looks right, then press the button and see where least squares actually puts it.</p>
  ${pfig('r1fit','<b>Figure.</b> Each grey stalk is one shop’s error — the vertical gap between what the line says and what the shop actually sold. Synthetic data.',
   `<div class="grid2">${sl('r1b0','Intercept  b₀  (sales when ad spend is zero)',0,10,0.1,3)}${sl('r1b1','Slope  b₁  (extra sales per $1,000 of ads)',-1,5,0.05,1)}</div>
    <div class="row"><button class="vb main" id="r1go">Fit it for me</button><button class="vb" id="r1sq">Show the squares</button><button class="vb" id="r1rs">Reset</button></div>
    <div class="stats" id="r1stat"></div>`)}
  <div class="eqn" id="r1eq"></div>`,
  init:()=>{let sq=false;
   const draw=()=>{
    const b0=+$('r1b0').value,b1=+$('r1b1').value;
    $('r1b0o').textContent=b0.toFixed(1);$('r1b1o').textContent=b1.toFixed(2);
    const w=640,h=340,pad={l:58,r:14,t:14,b:38};
    const A=axes(w,h,pad,[0,2.9],[3,14],'Weekly ad spend ($1,000s)','Weekly sales ($1,000s)',
      {xf:v=>'$'+v.toFixed(1)+'k',yf:v=>'$'+v.toFixed(0)+'k'});
    let s=A.frame,sse=0;
    R1D.forEach(p=>{const yh=b0+b1*p[0],e=p[1]-yh;sse+=e*e;
      if(sq){const side=Math.abs(A.Y(p[1])-A.Y(yh));
        s+=R(Math.min(A.X(p[0]),A.X(p[0])+ (e>0?side:-side))*0+A.X(p[0]),Math.min(A.Y(p[1]),A.Y(yh)),side,side,'#a6192e',{op:.1,s:'#a6192e',sw:.6})}
      s+=L(A.X(p[0]),A.Y(p[1]),A.X(p[0]),A.Y(yh),{c:'#95959b',w:1.4})});
    s+=L(A.X(0),A.Y(b0),A.X(2.9),A.Y(b0+b1*2.9),{c:'#73000a',w:2.8});
    R1D.forEach(p=>{s+=C(A.X(p[0]),A.Y(p[1]),4.6,'#a6192e',{s:'#fff',sw:1.4,op:.9})});
    $('r1fit').innerHTML=SV(w,h+4,s);
    const best=R1M.rss;
    $('r1stat').innerHTML=`<div class="hl"><b>${sse.toFixed(2)}</b>sum of squared errors</div><div><b>${best.toFixed(2)}</b>the best possible</div><div><b>${sse<=best*1.001?'you found it':'+'+(sse-best).toFixed(2)}</b>how far off you are</div>`;
    $('r1eq').innerHTML=`predicted sales = <span class="v">${b0.toFixed(1)}</span> + <span class="v">${b1.toFixed(2)}</span> × ad spend<small>Least squares picks the one pair of numbers that makes the sum of squared errors as small as it can possibly be. There is exactly one answer, and it has a closed form — no searching required.</small>`};
   $('r1go').onclick=()=>{$('r1b0').value=R1M.beta[0].toFixed(1);$('r1b1').value=R1M.beta[1].toFixed(2);draw()};
   $('r1rs').onclick=()=>{$('r1b0').value=3;$('r1b1').value=1;draw()};
   $('r1sq').onclick=()=>{sq=!sq;$('r1sq').classList.toggle('on',sq);$('r1sq').textContent=sq?'Hide the squares':'Show the squares';draw()};
   bind(['r1b0','r1b1'],draw)}},
 {html:()=>`<p class="q">Why squared, and why vertical.</p>
  <div class="grid2">
   <div><p style="margin-top:0"><b>Squared</b>, because plain errors cancel. A line that is $4,000 too high on one shop and $4,000 too low on the next has zero total error and is obviously not good. Squaring removes the signs, and it also means one terrible miss counts for more than several small ones — which is usually what you want, and occasionally is exactly what you do not want.</p></div>
   <div><p style="margin-top:0"><b>Vertical</b>, because y is the thing you are predicting and x is taken as given. The error is how wrong your prediction of sales was, not the shortest distance to the line. This is why regressing y on x and x on y give different lines, and why "which variable goes on the left" is a modelling decision, not a formatting one.</p></div>
  </div>
  <div class="eqn">R² = 1 − <span class="v">SSE</span> ⁄ <span class="v">SST</span><small>SSE is the squared error your line leaves behind. SST is the squared error you would have had using the flat average of y and no model at all. So R² is the share of the variation your line accounted for. A line no better than the average scores 0.</small></div>
  <div class="note red"><b>R² is not a grade.</b> An R² of 0.31 on human behaviour can be an excellent model; an R² of 0.95 on a time series can be a warning that something is leaking. Read it alongside what you were predicting and how it did on data it has not seen.</div>`}],
 quiz:[
 {q:'Your fitted line is  sales = 5.1 + 2.67 × ad spend, with ad spend in thousands. What does 2.67 mean?',
  o:['Sales are 2.67 times ad spend','Each extra $1,000 of ads goes with about $2,670 more in weekly sales, among shops like these','267% of sales come from advertising'],a:1,
  why:'A slope is a rate of change: how much y moves per one-unit move in x. Note the hedging: this is observational data, nobody randomised the ad budgets, and lesson 8 will show that a chunk of this 2.67 is really location.'},
 {q:'Two lines through the same points. Line A has SSE 180, line B has SSE 240. Which did least squares choose?',
  o:['Line A','Line B','Cannot tell without R²'],a:0,
  why:'Least squares means exactly one thing: the line with the smallest sum of squared errors. R² is just that same number rescaled, so it would give the same answer.'},
 {q:'Why does swapping which variable is y change the fitted line?',
  o:['It does not, the line is the same','Because the errors being minimised are measured vertically, toward whichever variable is y','Because the correlation changes'],a:1,
  why:'The correlation is symmetric but the regression is not. Minimising vertical gaps to sales is a different problem from minimising horizontal gaps to ad spend.'}],
 more:[{k:'book',t:'An introduction to statistical learning, chapter 3',a:'James, Witten, Hastie and Tibshirani',y:2021,u:'https://www.statlearning.com/',d:'The standard treatment, free and readable without heavy maths.'},
  {k:'explainer',t:'Ordinary least squares regression, explained visually',a:'MLU-Explain',y:2022,u:'https://mlu-explain.github.io/linear-regression/',d:'Drag the line yourself, from a different angle to the figure above.'}]};

/* ================= r2 — how a model learns ================= */
E.r2={id:'r2',nav:'How it learns',title:'How a model learns',
 short:'Gradient descent: the downhill walk that fits every model in this lecture and every neural network ever trained.',
 lead:'Simple regression has a formula, so the computer can jump straight to the answer. Almost nothing else does. For everything larger, the machine starts at a guess and walks downhill on the error surface. Watching it walk is the best way to understand what "training" actually means.',
 learn:[
 {tag:'play',tagl:'Explore',
  html:()=>`<p class="q">Start at a bad guess and walk downhill.</p>
  <p>The contours below are the error of the coffee-shop line at every pair of intercept and slope — a bowl, seen from above. Dark is low error. There is one bottom. Press <b>Take a step</b> and watch the walk — then change the step size and watch it go wrong.</p>
  ${pfig('r2gd','<b>Figure.</b> Left: the error surface over the two coefficients, with the path taken so far. Right: the line those coefficients give, on the actual data.',
   `<div class="grid2">${sl('r2lr','Learning rate (how big a step)',0.005,0.45,0.005,0.2,'Too small and it crawls. Too large and it overshoots the bottom and climbs the far wall.')}
    <div class="row" style="align-items:flex-end;padding-bottom:6px"><button class="vb main" id="r2step">Take a step</button><button class="vb" id="r2run">Run 40 steps</button><button class="vb" id="r2new">New starting point</button></div></div>
   <div class="stats" id="r2stat"></div>`)}
  <div id="r2say" class="note"></div>`,
  init:()=>{
   const xs=R1D.map(p=>p[0]),ys=R1D.map(p=>p[1]),n=xs.length;
   const loss=(b0,b1)=>xs.reduce((a,x,i)=>a+(b0+b1*x-ys[i])**2,0)/n;
   const best=loss(R1M.beta[0],R1M.beta[1]);
   const grad=(b0,b1)=>{let g0=0,g1=0;xs.forEach((x,i)=>{const e=b0+b1*x-ys[i];g0+=2*e;g1+=2*e*x});return [g0/n,g1/n]};
   let b0=0.6,b1=4.3,path=[[b0,b1]],steps=0,sseed=1,prev=null;
   const B0=[-1,11],B1=[-1.2,5.2];
   const step=()=>{const lr=+$('r2lr').value,[g0,g1]=grad(b0,b1);
     prev=loss(b0,b1);b0=clamp(b0-lr*g0,-40,60);b1=clamp(b1-lr*g1,-30,30);path.push([b0,b1]);steps++};
   const draw=()=>{
    $('r2lro').textContent=(+$('r2lr').value).toFixed(3);
    const w=660,h=300,p1={l:46,r:12,t:14,b:34};const pw=330;
    const X=v=>p1.l+(v-B0[0])/(B0[1]-B0[0])*(pw-p1.l-p1.r);
    const Y=v=>h-p1.b-(v-B1[0])/(B1[1]-B1[0])*(h-p1.t-p1.b);
    let s='';
    /* the loss surface of a least-squares fit is an exact quadratic bowl, so its
       contours are exact ellipses -- draw them instead of a pixel grid           */
    const mx1=mean(xs),mx2=mean(xs.map(v=>v*v));
    const M00=2,M01=2*mx1,M11=2*mx2;
    const Tr=M00+M11,De=M00*M11-M01*M01;
    const l1=(Tr+Math.sqrt(Math.max(0,Tr*Tr-4*De)))/2, l2=(Tr-Math.sqrt(Math.max(0,Tr*Tr-4*De)))/2;
    const th=0.5*Math.atan2(2*M01,M00-M11);
    const bx0=R1M.beta[0],bx1=R1M.beta[1];
    const sx=(pw-p1.l-p1.r)/(B0[1]-B0[0]), syy=(h-p1.t-p1.b)/(B1[1]-B1[0]);
    const corner=Math.max(...[[B0[0],B1[0]],[B0[0],B1[1]],[B0[1],B1[0]],[B0[1],B1[1]]]
      .map(([a,c])=>loss(a,c)-best));
    s+=`<clipPath id="r2clip"><rect x="${p1.l}" y="${p1.t}" width="${pw-p1.l-p1.r}" height="${h-p1.t-p1.b}"/></clipPath><g clip-path="url(#r2clip)">`;
    s+=R(p1.l,p1.t,pw-p1.l-p1.r,h-p1.t-p1.b,'#fdf6f6');
    const NL=13;
    for(let k=NL;k>=1;k--){const c=corner*(k/NL)**1.7;
      const aa=Math.sqrt(c/l2),bb=Math.sqrt(c/l1);        /* l2 = flat direction */
      const t=(1-k/NL)**0.85, col=`rgb(${Math.round(252-140*t)},${Math.round(236-205*t)},${Math.round(236-211*t)})`;
      s+=`<g transform="translate(${X(bx0)},${Y(bx1)}) scale(${sx},${-syy}) rotate(${th*180/Math.PI})">`+
         `<ellipse cx="0" cy="0" rx="${aa}" ry="${bb}" fill="${col}" stroke="rgba(255,255,255,.55)" stroke-width="${0.6/Math.max(sx,syy)}"/></g>`}
    s+='</g>';
    s+=L(p1.l,p1.t,p1.l,h-p1.b,{c:'#c9c9ce'})+L(p1.l,h-p1.b,pw-p1.r,h-p1.b,{c:'#c9c9ce'});
    for(let k=0;k<=3;k++){const v=B0[0]+(B0[1]-B0[0])*k/3;s+=T(X(v),h-p1.b+14,v.toFixed(0),{a:'middle',fs:10.5,c:'var(--grey-2)'})}
    for(let k=0;k<=3;k++){const v=B1[0]+(B1[1]-B1[0])*k/3;s+=T(p1.l-5,Y(v)+4,v.toFixed(0),{a:'end',fs:10.5,c:'var(--grey-2)'})}
    s+=T((p1.l+pw)/2,h-4,'intercept  b₀',{a:'middle',fs:12,w:600,c:'var(--grey)'});
    s+=`<text x="12" y="${h/2}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--grey)" transform="rotate(-90 12 ${h/2})">slope  b₁</text>`;
    s+=C(X(R1M.beta[0]),Y(R1M.beta[1]),6,'none',{s:'#2f7d4f',sw:2.4})+T(X(R1M.beta[0])+10,Y(R1M.beta[1])+4,'the bottom',{fs:11.5,w:700,c:'#2f7d4f'});
    if(path.length>1)s+=PATH(path.map((q,i)=>(i?'L':'M')+clamp(X(q[0]),p1.l,pw)+','+clamp(Y(q[1]),p1.t,h-p1.b)).join(''),{c:'#b59a57',w:2});
    path.forEach((q,i)=>{if(i%2===0||i===path.length-1)s+=C(clamp(X(q[0]),p1.l,pw),clamp(Y(q[1]),p1.t,h-p1.b),i===path.length-1?5:2.6,i===path.length-1?'#73000a':'#b59a57',{s:i===path.length-1?'#fff':'none',sw:1.6})});
    const p2={l:pw+58,r:12,t:14,b:34};
    const X2=v=>p2.l+(v-0)/2.9*(w-p2.l-p2.r),Y2=v=>h-p2.b-(v-3)/11*(h-p2.t-p2.b);
    s+=L(p2.l,p2.t,p2.l,h-p2.b,{c:'#c9c9ce'})+L(p2.l,h-p2.b,w-p2.r,h-p2.b,{c:'#c9c9ce'});
    for(let i=0;i<=4;i++){const v=3+11*i/4;s+=L(p2.l,Y2(v),w-p2.r,Y2(v),{c:'#eeeef1'})+T(p2.l-6,Y2(v)+4,'$'+v.toFixed(0)+'k',{a:'end',fs:11,c:'var(--grey-2)'})}
    R1D.forEach(q=>s+=C(X2(q[0]),Y2(q[1]),3.8,'#a6192e',{op:.72}));
    s+=L(X2(0),Y2(clamp(b0,-5,40)),X2(2.9),Y2(clamp(b0+b1*2.9,-5,40)),{c:'#73000a',w:2.6});
    s+=T((p2.l+w-p2.r)/2,h-4,'ad spend → sales',{a:'middle',fs:12,w:600,c:'var(--grey)'});
    $('r2gd').innerHTML=SV(w,h+4,s);
    const cur=loss(b0,b1);
    $('r2stat').innerHTML=`<div><b>${steps}</b>steps taken</div><div><b>${b0.toFixed(2)} / ${b1.toFixed(2)}</b>b₀ and b₁ now</div><div class="hl"><b>${cur>1e6?'→ ∞':cur.toFixed(3)}</b>error now</div><div><b>${best.toFixed(3)}</b>the best there is</div>`;
    const sy=$('r2say');
    if(cur>1e4||(prev!==null&&cur>prev*1.0001&&steps>0)){sy.className='note red';sy.innerHTML=(cur>1e4?'<b>It exploded.</b>':'<b>It is going the wrong way.</b>')+' '+'The step is so large that each move overshoots the valley and lands further up the opposite wall, so the error grows instead of shrinking — and once that starts it does not stop. This is the most common way a training run fails, and the fix is almost always a smaller learning rate.'}
    else if(+$('r2lr').value<0.045){sy.className='note';sy.innerHTML='<b>Crawling.</b> Every step is in the right direction and each one barely moves. With a rate this small you need hundreds of steps, which on a real model means hours of compute for no reason.'}
    else if(cur<best*1.02&&steps>0){sy.className='note';sy.style.cssText='background:#eaf5ee;border-left-color:#2f7d4f';sy.innerHTML='<b>Converged.</b> The walk has reached the bottom and the gradient is now nearly zero, so further steps change almost nothing. For simple regression the formula would have told us this instantly — but for a neural network with a billion weights, this walk is the only option there is.'}
    else{sy.className='note';sy.style.cssText='';sy.innerHTML='<b>Walking.</b> At each point the gradient says which way is steepest uphill; the step goes the other way. Notice the steps get shorter as the ground flattens, without anyone telling them to — the gradient itself shrinks near the bottom.'}};
   $('r2step').onclick=()=>{step();draw()};
   $('r2run').onclick=()=>{for(let i=0;i<40;i++)step();draw()};
   $('r2new').onclick=()=>{const r=rng(sseed++*7919);b0=-0.5+10*r();b1=-1+5.5*r();path=[[b0,b1]];steps=0;prev=null;draw()};
   bind(['r2lr'],draw)}},
 {html:()=>`<p class="q">The same three lines, for every model there is.</p>
  <div class="eqn">1. predict &nbsp;→&nbsp; 2. measure how wrong you were &nbsp;→&nbsp; 3. nudge every parameter in the direction that reduces the error<small>Repeat. That is training. The only things that change between a two-parameter regression and a frontier language model are how many parameters there are and how the gradient is computed.</small></div>
  <table class="tb"><thead><tr><th>Word you will hear</th><th>What it actually means</th></tr></thead><tbody>
  <tr><td class="nm">Loss function</td><td>The single number measuring how wrong the model currently is. For regression, usually mean squared error.</td></tr>
  <tr><td class="nm">Gradient</td><td>Which way is uphill, for every parameter at once. The step goes the other way.</td></tr>
  <tr><td class="nm">Learning rate</td><td>How far to move each step. The knob you saw break the run above.</td></tr>
  <tr><td class="nm">Epoch</td><td>One pass through the whole training set.</td></tr>
  <tr><td class="nm">Batch</td><td>Computing the gradient on a slice of the data rather than all of it, because all of it will not fit in memory.</td></tr>
  <tr><td class="nm">Convergence</td><td>The error has stopped falling. Not necessarily at the best possible answer — just somewhere flat.</td></tr>
  </tbody></table>
  <div class="note blue"><b>Why this matters beyond regression.</b> Gradient descent is the reason deep learning works at all. A network has no closed-form solution and no way to reason about its own structure; it only knows how to be slightly less wrong than it was a moment ago, a few hundred billion times in a row.</div>`}],
 quiz:[
 {q:'Your training loss rises steadily instead of falling. What is the first thing to change?',
  o:['Add more data','Lower the learning rate','Add more parameters'],a:1,
  why:'A rising loss is the signature of overshooting. Each step jumps past the minimum onto higher ground. Cut the learning rate, often by a factor of ten, before changing anything else.'},
 {q:'Why does simple linear regression not actually need gradient descent?',
  o:['It has a closed-form solution you can compute directly','Its loss has no minimum','Gradient descent only works on classifiers'],a:0,
  why:'Least squares has an exact algebraic answer. Gradient descent is shown here because it is the method that generalises to everything that does not.'},
 {q:'The steps get shorter as the walk nears the bottom, with no change to the learning rate. Why?',
  o:['The algorithm detects it is close','The gradient itself is smaller where the surface is flatter','The learning rate decays automatically'],a:1,
  why:'Step size is learning rate times gradient. Near the bottom the slope is shallow, so the gradient shrinks and the steps shrink with it, automatically.'}],
 more:[{k:'explainer',t:'Why momentum really works',a:'Goh, Distill',y:2017,u:'https://distill.pub/2017/momentum/',d:'What people add to plain gradient descent, and why.'},
  {k:'video',t:'Gradient descent, how neural networks learn',a:'3Blue1Brown',y:2017,u:'https://www.3blue1brown.com/lessons/gradient-descent',d:'Twenty minutes, and the best visual intuition available anywhere.'}]};

E.r3={id:'r3',nav:'Many features',title:'More than one feature',
 short:'Multiple regression, what "holding everything else constant" really buys you, and why you must not rank coefficients by size.',
 lead:'One feature is rarely the whole story. Shops with bigger ad budgets also tend to sit in busier locations, so a slope on advertising alone is quietly carrying foot traffic on its back. Multiple regression separates them — up to a point, and that point is worth knowing.',
 learn:[
 {tag:'play',tagl:'Explore',
  html:()=>`<p class="q">Switch features on and watch the coefficients move.</p>
  <p>All 60 shops. Tick features to put them in the model. Watch what happens to the advertising coefficient when foot traffic joins it.</p>
  ${pfig('r3out','',`<div class="row" id="r3btns" style="margin-bottom:4px"></div><div class="stats" id="r3stat"></div>`)}
  <div id="r3say" class="note"></div>`,
  init:()=>{
   let on=[true,false,false,false,false];
   const y=SHOP.map(s=>s.sales);
   const draw=()=>{
    $('r3btns').innerHTML=SHOPF.map((f,i)=>`<button class="vb ${on[i]?'on':''}" data-i="${i}">${on[i]?'✓ ':''}${f[1]}</button>`).join('');
    $('r3btns').querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;if(on[i]&&on.filter(Boolean).length===1)return;on[i]=!on[i];draw()});
    const idx=on.map((v,i)=>v?i:-1).filter(i=>i>=0);
    const X=SHOP.map(s=>idx.map(i=>s[SHOPF[i][0]]));
    const m=ols(X,y);
    const rows=idx.map((i,j)=>{const b=m.beta[j+1],t=m.t[j+1];
      return `<tr><td class="nm">${SHOPF[i][1]}</td><td class="n">${b>=0?'+':''}${b.toFixed(2)}</td><td class="n">${m.se[j+1].toFixed(2)}</td><td class="n" style="color:${Math.abs(t)>2?'#2f7d4f':'#95959b'};font-weight:600">${t.toFixed(1)}</td><td style="color:${Math.abs(t)>2?'#2f7d4f':'#95959b'}">${Math.abs(t)>2?'clearly non-zero':'could be zero'}</td></tr>`}).join('');
    $('r3out').innerHTML=`<div class="tbw"><table class="tb"><thead><tr><th>Feature</th><th style="text-align:right">Coefficient</th><th style="text-align:right">Std. error</th><th style="text-align:right">t</th><th>Verdict</th></tr></thead><tbody>
      <tr><td class="nm" style="color:var(--grey)">Intercept</td><td class="n">${m.beta[0].toFixed(0)}</td><td class="n">${m.se[0].toFixed(0)}</td><td class="n">${m.t[0].toFixed(1)}</td><td style="color:var(--grey)">sales with every feature at zero</td></tr>
      ${rows}</tbody></table></div>`;
    $('r3stat').innerHTML=`<div><b>${idx.length}</b>features in</div><div class="hl"><b>${m.r2.toFixed(3)}</b>R²</div><div><b>${m.ar2.toFixed(3)}</b>adjusted R²</div><div><b>${Math.round(Math.sqrt(m.rss/(60-idx.length-1))).toLocaleString()}</b>typical miss ($)</div>`;
    const sy=$('r3say');
    const adOnly=on[0]&&idx.length===1, adFoot=on[0]&&on[1];
    if(adOnly){sy.className='note';sy.innerHTML='<b>Advertising alone: about +'+m.beta[1].toFixed(2)+' in sales per dollar.</b> Hold that number in your head and now tick <b>foot traffic</b>.'}
    else if(adFoot){sy.className='note';sy.style.cssText='background:#e8f1f7;border-left-color:#1f5f8b';
      sy.innerHTML='<b>The advertising coefficient dropped to +'+m.beta[1].toFixed(2)+'.</b> Part of what looked like the effect of advertising was really the effect of being in a busy location. Now that foot traffic is in the model, the advertising coefficient means <em>among shops with the same foot traffic</em> — which is the question you wanted answered all along.'}
    else {sy.className='note';sy.style.cssText='';sy.innerHTML='<b>Adjusted R² is the one to watch.</b> Plain R² can only rise when you add a feature, even a useless one. Adjusted R² charges you for each feature and will fall if the feature did not earn its place.'}};
   draw()}},
 {html:()=>`<p class="q">How to read a coefficient out loud.</p>
  <div class="eqn">sales = b₀ + <span class="v">b₁</span>·ads + b₂·traffic + b₃·seats + …<small>b₁ is the change in sales for a one-unit change in ads, <b>among shops that are identical on every other feature in the model</b>.</small></div>
  <p>That last clause is the entire value of multiple regression, and it has two sharp edges. It only holds for features <em>in the model</em> — anything you left out is still tangled into the coefficients. And it is a statement about comparing shops, not about what would happen if you changed one. Nobody randomised these ad budgets.</p>
  <div class="grid2">
   <div class="note red" style="margin:0"><b>Do not rank coefficients by size.</b> Ad spend is in dollars and rating is on a 1-to-5 scale. Their coefficients are in different units and comparing them is meaningless. If you want importance, standardize first, or look at t-statistics.</div>
   <div class="note" style="margin:0"><b>Correlated features confuse each other.</b> Put two near-identical features in and the model cannot tell which deserves the credit. Both coefficients become unstable, standard errors balloon, and signs can flip. The fit stays fine; the story falls apart.</div>
  </div>`},
 {html:()=>`<p class="q">When two features say the same thing.</p>
  <p>Below, the correlation between every pair of features in the coffee-shop data. Advertising and foot traffic sit at 0.77, which is exactly why the advertising coefficient moved so much a moment ago. That is high enough to notice and not high enough to panic. Above about 0.9 you should be picking one, combining them, or moving to lesson 10.</p>
  ${pfig('r3corr','<b>Figure.</b> Darker means more strongly related. The diagonal is each feature with itself.')}`,
  init:()=>{const F=[...SHOPF.map(f=>f[0]),'sales'],N=[...SHOPF.map(f=>f[1].split(' (')[0]),'Weekly sales'];
   const n=F.length,w=640,cell=52,left=132,top=92;let s='';
   for(let i=0;i<n;i++){
    s+=`<text x="${left+i*cell+cell/2}" y="${top-10}" text-anchor="start" font-size="11.5" fill="var(--grey)" transform="rotate(-42 ${left+i*cell+cell/2} ${top-10})">${N[i]}</text>`;
    s+=T(left-8,top+i*cell+cell/2+4,N[i],{a:'end',fs:11.5,c:'var(--grey)'})}
   for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const r=corr(SHOP.map(x=>x[F[i]]),SHOP.map(x=>x[F[j]]));const a=Math.abs(r);
    const c=i===j?'#f0f0f3':(r>0?`rgba(166,25,46,${(a*.82).toFixed(2)})`:`rgba(31,95,139,${(a*.82).toFixed(2)})`);
    s+=R(left+j*cell,top+i*cell,cell-2,cell-2,c,{r:5})+T(left+j*cell+cell/2-1,top+i*cell+cell/2+4,i===j?'1':r.toFixed(2),{a:'middle',fs:11.5,w:600,c:a>.55&&i!==j?'#fff':'var(--ink-2)'})}
   s+=T(left,top+n*cell+24,'Red = move together.  Blue = move apart.  Ad spend and foot traffic are the pair to watch.',{fs:12,c:'var(--grey)'});
   $('r3corr').innerHTML=SV(w,top+n*cell+36,s)}}],
 quiz:[
 {q:'Adding foot traffic cuts the advertising coefficient roughly in half. What happened?',
  o:['Advertising stopped working','Some of what the simple model credited to advertising was really location','The model became less accurate'],a:1,
  why:'Busy locations both advertise more and sell more. With only ad spend in the model, the ad coefficient absorbs the location effect. Adding foot traffic hands that part back to where it belongs.'},
 {q:'R² rose from 0.72 to 0.73 when you added a feature, and adjusted R² fell. What does that tell you?',
  o:['The feature helped slightly','The feature did not earn its place','There is a bug'],a:1,
  why:'Plain R² can never fall when you add anything. Adjusted R² charges a price per feature. When it falls, the gain was smaller than the cost of the extra parameter.'},
 {q:'Which comparison is legitimate?',
  o:['Ad spend coefficient 1.42 versus rating coefficient 540, so rating matters more','The t-statistic on ad spend versus the t-statistic on rating','Neither comparison is ever valid'],a:1,
  why:'Raw coefficients live in different units and cannot be ranked. t-statistics are unitless, so they can be compared — they measure how confident you are that each coefficient is not zero, not how big the effect is.'}],
 more:[{k:'book',t:'Regression and other stories',a:'Gelman, Hill and Vehtari',y:2020,u:'https://avehtari.github.io/ROS-Examples/',d:'The best book on reading a regression out loud without overclaiming.'},
  {k:'article',t:'Multicollinearity in regression',a:'Penn State STAT 462',y:2023,u:'https://online.stat.psu.edu/stat462/node/177/',d:'Worked examples of coefficients going unstable, with VIF.'}]};

/* ================= r4 — curves and interactions ================= */
/* diminishing-returns data: email sends vs signups */
const SAT=(()=>{const r=rng(4242),a=[];
 for(let i=0;i<48;i++){const x=+(0.4+9.4*r()).toFixed(2);
  a.push([x,+(18+11.5*Math.log(x)+2.0*gauss(r)).toFixed(1)])}
 return a.sort((p,q)=>p[0]-q[0])})();
const FORMS=[
 {k:'lin',n:'Straight line',eq:'ŷ = b₀ + b₁x',f:x=>[x],
  say:'A straight line has one rate of change and uses it everywhere. The data clearly bends, so the line is too low at the start, too high in the middle, and too low again at the end. Look at the residual strip: that smile is the tell.'},
 {k:'quad',n:'Quadratic',eq:'ŷ = b₀ + b₁x + b₂x²',f:x=>[x,x*x],
  say:'Adding x² lets the curve bend once. It fits far better and it is still ordinary least squares — x² is just another column. But a parabola must eventually turn back down, and nothing here says signups will start falling.'},
 {k:'log',n:'Log of x',eq:'ŷ = b₀ + b₁ log x',f:x=>[Math.log(x)],
  say:'This is the right shape. Each <em>doubling</em> of sends adds a constant number of signups, which is what diminishing returns actually means, and the curve flattens forever instead of turning down. One feature, no extra parameters, best fit of the three.'},
 {k:'cube',n:'Cubic',eq:'ŷ = b₀ + b₁x + b₂x² + b₃x³',f:x=>[x,x*x,x*x*x],
  say:'Barely better than the quadratic and harder to defend. When a cubic beats a quadratic by a hair, you are usually buying noise. Prefer the form you can explain to the one that squeezes out another 0.004.'}];
E.r4={id:'r4',nav:'Curves',title:'Curves and interactions',
 short:'Polynomial terms, log transforms, and interactions — three ways a straight-line model handles things that are not straight.',
 lead:'"Linear regression" means linear in the coefficients, not linear in the picture. You can fit curves, saturation, and effects that depend on each other, and it is all still least squares. This is the lesson that makes regression far more useful than it first looks.',
 learn:[
 {tag:'play',tagl:'Explore',
  html:()=>`<p class="q">Same data, four model forms.</p>
  <p>Forty-eight weeks of an email campaign. Across: thousands of emails sent. Up: signups. The relationship saturates — the first thousand emails do far more than the tenth. Try each form.</p>
  ${pfig('r4fig','<b>Figure.</b> The strip underneath shows the residuals. A good model leaves a formless band; a bad one leaves a pattern.',
   `<div class="row" id="r4btns" style="margin-bottom:4px"></div><div class="stats" id="r4stat"></div>`)}
  <div class="eqn" id="r4eq"></div><div class="note" id="r4say"></div>`,
  init:()=>{let cur=0;
   const draw=()=>{
    $('r4btns').innerHTML=FORMS.map((f,i)=>`<button class="vb ${i===cur?'on':''}" data-i="${i}">${f.n}</button>`).join('');
    $('r4btns').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()});
    const F=FORMS[cur],m=ols(SAT.map(p=>F.f(p[0])),SAT.map(p=>p[1]));
    const w=640,h=300,rh=86,pad={l:52,r:14,t:14,b:34};
    const A=axes(w,h,pad,[0,10],[10,46],'Emails sent (thousands)','Signups',{xf:v=>v.toFixed(0)});
    let s=A.frame,d='';
    for(let i=0;i<=200;i++){const x=0.35+i/200*9.6;d+=(i?'L':'M')+A.X(x)+','+A.Y(clamp(m.pred(F.f(x)),0,80))}
    s+=`<clipPath id="r4c"><rect x="${pad.l}" y="${pad.t}" width="${w-pad.l-pad.r}" height="${h-pad.t-pad.b}"/></clipPath><g clip-path="url(#r4c)">${PATH(d,{c:'#73000a',w:2.8})}</g>`;
    SAT.forEach(p=>s+=C(A.X(p[0]),A.Y(p[1]),4,'#a6192e',{op:.6}));
    /* residual strip */
    const res=SAT.map((p,i)=>p[1]-m.fit[i]),mx=Math.max(...res.map(Math.abs));
    const ry=h+28,RY=v=>ry+26-v/mx*22;
    s+=T(pad.l,ry+4,'residuals (actual − predicted)',{fs:11.5,w:600,c:'var(--grey)'});
    s+=R(pad.l,ry+8,w-pad.l-pad.r,52,'#fff',{r:7,s:'#e6e6ea'});
    s+=L(pad.l,RY(0),w-pad.r,RY(0),{c:'#c9c9ce',d:'3 3'});
    SAT.forEach((p,i)=>s+=C(A.X(p[0]),RY(res[i]),3,res[i]>0?'#a6192e':'#1f5f8b',{op:.72}));
    $('r4fig').innerHTML=SV(w,h+rh,s);
    $('r4stat').innerHTML=`<div class="hl"><b>${m.r2.toFixed(3)}</b>R²</div><div><b>${m.ar2.toFixed(3)}</b>adjusted R²</div><div><b>${m.beta.length-1}</b>feature columns</div><div><b>${Math.sqrt(m.rss/SAT.length).toFixed(2)}</b>typical miss (signups)</div>`;
    $('r4eq').innerHTML=F.eq+`<small>Fitted: ŷ = ${m.beta.map((b,i)=>(i?(b>=0?' + ':' − ')+Math.abs(b).toFixed(2)+(i===1?(F.k==='log'?' log x':' x'):' x'+'^'+i):b.toFixed(2))).join('')}</small>`;
    $('r4say').innerHTML=F.say};
   draw()}},
 {html:()=>`<p class="q">Why this is still linear regression.</p>
  <div class="eqn">ŷ = b₀ + b₁·<span class="v">x</span> + b₂·<span class="v">x²</span> + b₃·<span class="v">log x</span><small>"Linear" refers to the <b>b</b>s, not the <b>x</b>s. Square a column, take its log, multiply two columns together — the model still adds up weighted features, so least squares still solves it in one shot.</small></div>
  <table class="tb"><thead><tr><th>Transform</th><th>Use it when</th><th>Read the coefficient as</th></tr></thead><tbody>
  <tr><td class="nm">x²  (polynomial)</td><td>the relationship rises then falls, or bends sharply</td><td>no single rate; the slope changes along x</td></tr>
  <tr><td class="nm">log x</td><td>diminishing returns: each doubling adds the same amount</td><td>a 1% rise in x is linked to b₁/100 more y</td></tr>
  <tr><td class="nm">log y</td><td>the effect is a percentage, not an amount; y is skewed and positive</td><td>a one-unit rise in x is linked to about 100·b₁ % more y</td></tr>
  <tr><td class="nm">log y and log x</td><td>elasticity, the economist's default</td><td>a 1% rise in x is linked to b₁ % more y</td></tr>
  <tr><td class="nm">x₁ × x₂  (interaction)</td><td>the effect of one feature depends on the level of another</td><td>how much the slope on x₁ changes per unit of x₂</td></tr>
  </tbody></table>
  <div class="note red"><b>A polynomial is where overfitting starts.</b> You already saw this in lesson 4. x² is usually defensible, x³ sometimes, anything beyond that almost never. If you want a curve with more freedom than that, you want a different model, not a higher power.</div>`},
 {tag:'play',tagl:'Explore',
  html:()=>`<p class="q">Interactions: when the slope itself depends on something.</p>
  <p>Does a dollar of advertising do the same work in a quiet shop as in a busy one? A plain model has to assume yes — one slope for everybody. An interaction term lets the answer differ.</p>
  ${pfig('r4int','<b>Figure.</b> Two lines, one model. With the interaction term off, the model is forced to give both groups the same slope.',
   `<div class="row"><button class="vb main" id="r4ia">Without interaction</button><button class="vb" id="r4ib">With interaction</button></div><div class="stats" id="r4istat"></div>`)}
  <div class="note" id="r4isay"></div>`,
  init:()=>{let inter=false;
   const med=SHOP.map(s=>s.foot).sort((a,b)=>a-b)[30];
   const draw=()=>{
    $('r4ia').classList.toggle('main',!inter);$('r4ib').classList.toggle('main',inter);
    const X=SHOP.map(s=>{const busy=s.foot>med?1:0;const a=s.ad/1000;
      return inter?[a,busy,a*busy]:[a,busy]});
    const m=ols(X,SHOP.map(s=>s.sales/1000));
    const w=640,h=300,pad={l:56,r:14,t:14,b:36};
    const A=axes(w,h,pad,[0,2.9],[3,17],'Weekly ad spend ($1,000s)','Weekly sales ($1,000s)',
      {xf:v=>'$'+v.toFixed(1)+'k',yf:v=>'$'+v.toFixed(0)+'k'});
    let s=A.frame;
    SHOP.forEach(sh=>{const busy=sh.foot>med?1:0;
      s+=C(A.X(sh.ad/1000),A.Y(sh.sales/1000),4,busy?'#a6192e':'#1f5f8b',{op:.6})});
    [0,1].forEach(b=>{const p0=inter?[0,b,0]:[0,b],p1=inter?[2.9,b,2.9*b]:[2.9,b];
      s+=L(A.X(0),A.Y(m.pred(p0)),A.X(2.9),A.Y(m.pred(p1)),{c:b?'#a6192e':'#1f5f8b',w:2.8})});
    s+=T(w-20,pad.t+16,'● busy shops',{a:'end',fs:12.5,w:600,c:'#a6192e'});
    s+=T(w-20,pad.t+34,'● quiet shops',{a:'end',fs:12.5,w:600,c:'#1f5f8b'});
    $('r4int').innerHTML=SV(w,h+4,s);
    const sQ=m.beta[1],sB=inter?m.beta[1]+m.beta[3]:m.beta[1];

const R5=(()=>{const r=rng(3);
 const rows=SHOP.map(s=>({x:[s.ad,s.foot,s.seats,s.items,s.rate,
   s.ad*(1+0.008*gauss(r)),      /* the same ad spend, from a second reporting system */
   s.foot*(1+0.008*gauss(r)),    /* an estimate of the same foot traffic */
   50*r(), 50*r(), 50*r(), 50*r(), 50*r()],   /* five columns of pure noise */
  y:s.sales}));
 return {rows,
   names:['Ad spend','Foot traffic','Seats','Menu items','Rating',
          'Ad spend (2nd system)','Foot traffic (est.)',
          'Loyalty-app index','Weather index','Parking score','Shelf-tidiness score','Local events index'],
   real:5, tr:rows.slice(0,24), te:rows.slice(24)}})();
const R5Z=(()=>{const p=R5.rows[0].x.length,tr=R5.tr;
 const mu=[...Array(p)].map((_,j)=>mean(tr.map(r=>r.x[j])));
 const sg=[...Array(p)].map((_,j)=>sd(tr.map(r=>r.x[j]))||1);
 const z=r=>r.x.map((v,j)=>(v-mu[j])/sg[j]);
 const Xtr=tr.map(z),ytr=tr.map(r=>r.y),my=mean(ytr);
 const lmax=Math.max(...[...Array(p)].map((_,j)=>Math.abs(Xtr.reduce((a,x,i)=>a+x[j]*(ytr[i]-my),0))))*2/tr.length;
 return {p,mu,sg,z,Xtr,ytr,lmax,Xte:R5.te.map(z),yte:R5.te.map(r=>r.y)}})();
const rmse=(m,X,y)=>Math.sqrt(X.reduce((a,x,i)=>a+(m(x)-y[i])**2,0)/X.length);

E.r5={id:'r5',nav:'Shrinking',title:'Keeping coefficients small',
 short:'Ridge and lasso: paying a penalty for large coefficients, and why that makes a model better on data it has not seen.',
 lead:'Least squares has exactly one goal: make the errors on the training data as small as possible. That is precisely the instruction that produces overfitting. Regularization adds a second goal — keep the coefficients small — and trading a little training accuracy for it usually buys real accuracy on new data.',
 learn:[
 {html:()=>`<p class="q">One extra term, two different penalties.</p>
  <div class="grid2">
   <div class="eqn" style="margin:0"><b style="color:var(--maroon)">Ridge</b><br>minimise &nbsp;RSS + <span class="v">λ</span> Σ b²<small>Squared penalty. Shrinks every coefficient toward zero, never all the way. Good when the features are correlated and you believe they all matter a little.</small></div>
   <div class="eqn" style="margin:0"><b style="color:var(--maroon)">Lasso</b><br>minimise &nbsp;RSS + <span class="v">λ</span> Σ |b|<small>Absolute-value penalty. Shrinks, and sets weak coefficients to exactly zero. It selects features for you. Good when you believe most features are useless.</small></div>
  </div>
  <p>λ is the price per unit of coefficient. At λ = 0 you are back to ordinary least squares and the penalty does nothing. As λ rises, the model is increasingly unwilling to lean hard on any one feature, and at a large enough λ every coefficient is crushed to nothing and the model predicts the average for everyone.</p>
  <div class="note"><b>Standardize first, always.</b> The penalty is applied to the coefficients, and coefficients depend on units. Measure ad spend in cents instead of dollars and its coefficient becomes a hundred times smaller, so it would be penalised a hundred times less. Everything below is on standardized features.</div>`},
 {tag:'play',tagl:'Explore',
  html:()=>`<p class="q">Turn the price up and watch what survives.</p>
  <p>Twelve features now, and seven of them are traps: a second advertising figure from a different reporting system, an estimated foot-traffic column, and five columns of pure noise with business-sounding names. Only twenty-four shops to train on, thirty-six held back. Slide λ up.</p>
  ${pfig('r5fig','<b>Figure.</b> Left: every coefficient as λ rises, with your current λ marked. Right: where the coefficients stand right now. The seven traps are drawn in grey.',
   `<div class="row" style="margin-bottom:2px"><button class="vb main" id="r5ridge">Ridge</button><button class="vb" id="r5lasso">Lasso</button></div>
    ${sl('r5lam','Penalty strength λ',0,100,1,0,'Position on the path, from no penalty at all to a very heavy one.')}
    <div class="stats" id="r5stat"></div>`)}
  <div class="note" id="r5say"></div>`,
  init:()=>{
   let mode='ridge';
   const GRID=[...Array(101)].map((_,i)=>i);
   const lamOf=i=>mode==='ridge'?Math.exp(i/100*Math.log(501))-1:R5Z.lmax*(i/100)**2;
   const coefs=i=>{const lam=lamOf(i);
    if(mode==='ridge'){const m=ols(R5Z.Xtr,R5Z.ytr,lam);return {b:m.beta.slice(1),pred:x=>m.pred(x)}}
    const L0=lasso(R5Z.Xtr,R5Z.ytr,lam);const b=L0.bz;
    return {b,pred:x=>L0.my+x.reduce((a,v,j)=>a+v*b[j],0)}};
   const cache={};const getC=i=>cache[mode+'_'+i]||(cache[mode+'_'+i]=coefs(i));
   const COL=['#a6192e','#1f5f8b','#8a7239','#2f7d4f','#6b4a8a','#bdbdc4','#bdbdc4','#dadade','#dadade','#dadade','#dadade','#dadade'];
   const draw=()=>{
    const i=+$('r5lam').value;const C0=getC(i);
    $('r5lamo').textContent=lamOf(i).toFixed(1);
    $('r5ridge').classList.toggle('main',mode==='ridge');$('r5lasso').classList.toggle('main',mode==='lasso');
    const w=690,h=342,pw=350,pad={l:46,r:14,t:16,b:40};
    const all=GRID.map(k=>getC(k).b);
    const mx=Math.max(...all.flat().map(Math.abs))*1.08;const Z0=v=>Math.abs(v)<1e-9;
    const X=k=>pad.l+k/100*(pw-pad.l-pad.r),Y=v=>(h-pad.b+pad.t)/2-v/mx*((h-pad.t-pad.b)/2);
    let s='';
    for(let g=-2;g<=2;g++){const v=g*mx/2;s+=L(pad.l,Y(v),pw-pad.r,Y(v),{c:g===0?'#c9c9ce':'#eeeef1'})+T(pad.l-6,Y(v)+4,Math.round(v),{a:'end',fs:10.5,c:'var(--grey-2)'})}
    for(let j=R5Z.p-1;j>=0;j--)s+=PATH(GRID.map(k=>(k?'L':'M')+X(k)+','+Y(all[k][j])).join(''),{c:COL[j],w:j>=R5.real?1.3:2.2,op:j>=R5.real?.9:1});
    s+=L(X(i),pad.t,X(i),h-pad.b,{c:'#1d1d1f',w:1.6,d:'4 3'});
    C0.b.forEach((v,j)=>s+=C(X(i),Y(v),3.4,COL[j]));
    s+=T(pad.l,h-pad.b+18,'λ = 0',{fs:11,c:'var(--grey-2)'})+T(pw-pad.r,h-pad.b+18,'heavy penalty',{a:'end',fs:11,c:'var(--grey-2)'});
    s+=T((pad.l+pw)/2,h-6,'penalty strength  λ  →',{a:'middle',fs:12,w:600,c:'var(--grey)'});
    s+=T(pw-pad.r,pad.t-3,'coefficient on standardized features',{a:'end',fs:11,w:600,c:'var(--grey-2)'});
    /* right: current bars */
    const bx=pw+126,bw=w-bx-14;
    R5.names.forEach((nm,j)=>{const y=16+j*26,v=C0.b[j],len=Math.abs(v)/mx*(bw*.52);
     s+=T(bx-8,y+4,nm,{a:'end',fs:10.8,w:j>=R5.real?400:600,c:j>=R5.real?'var(--grey-2)':'var(--ink-2)'});
     s+=L(bx+bw*.52,y-8,bx+bw*.52,y+10,{c:'#e6e6ea'});
     s+=R(v>=0?bx+bw*.52:bx+bw*.52-len,y-5,Math.max(len,0.7),11,COL[j],{r:3});
     s+=T(bx+bw*.52+(v>=0?len+6:-len-6),y+5,Z0(v)?'0':Math.round(v),{a:v>=0?'start':'end',fs:10.8,w:600,c:Z0(v)?'#95959b':'var(--ink-2)'})});
    $('r5fig').innerHTML=SV(w,h+4,s);
    const trE=rmse(C0.pred,R5Z.Xtr,R5Z.ytr),teE=rmse(C0.pred,R5Z.Xte,R5Z.yte);
    const zero=C0.b.filter(Z0).length;
    const trapsZero=C0.b.slice(R5.real).filter(Z0).length;
    const realZero=C0.b.slice(0,R5.real).filter(Z0).length;
    const nTrap=R5Z.p-R5.real;
    $('r5stat').innerHTML=`<div><b>${Math.round(trE).toLocaleString()}</b>train error</div><div class="hl"><b>${Math.round(teE).toLocaleString()}</b>error on the held-out shops</div><div><b>${R5Z.p-zero}${mode==='ridge'?' of 12':''}</b>features still in use</div><div><b>${lamOf(i).toFixed(1)}</b>λ</div>`;
    const sy=$('r5say');
    if(i===0){sy.className='note red';sy.innerHTML='<b>λ = 0 is plain least squares.</b> Look at the two advertising coefficients: enormous and pointing in opposite directions, fighting over the same signal. All five noise columns have been given coefficients too, and none of them mean anything. The model fits 40 shops beautifully and is three times worse on the 36 it has not seen.'}
    else if(mode==='lasso'&&zero>=5){sy.className='note';sy.style.cssText='background:#eaf5ee;border-left-color:#2f7d4f';sy.innerHTML='<b>Lasso has thrown '+zero+' of the 12 features out entirely.</b> Not shrunk — zero. '+trapsZero+' of the '+nTrap+' traps are gone'+(realZero?', and so are '+realZero+' of the five real features — lasso is not gentle':'')+'. That is feature selection happening inside the fit, which is the main reason people reach for it.'}
    else if(i>85){sy.className='note';sy.style.cssText='';sy.innerHTML='<b>Too much.</b> The penalty now dominates the fit. Coefficients are crushed toward zero, the model is barely using the data, and both errors are rising together. Underfitting, arrived at from the other direction.'}
    else{sy.className='note';sy.style.cssText='';sy.innerHTML=mode==='ridge'
      ? '<b>Ridge shrinks everything and keeps everything.</b> The two advertising coefficients stop fighting and settle into sharing the credit, and the noise columns are squeezed down near zero — but never <em>to</em> zero, so all twelve features are still in the model. Compare the held-out error with what it was at λ = 0: a worse fit on the training shops, a better model.'
      : '<b>Lasso is pruning.</b> Weak coefficients hit zero and stay there — '+zero+' are already gone. Watch the seven grey lines go flat first — they are the traps, and the penalty found them before you did.'}};
   $('r5ridge').onclick=()=>{mode='ridge';draw()};$('r5lasso').onclick=()=>{mode='lasso';draw()};
   bind(['r5lam'],draw)}},
 {html:()=>`<p class="q">Which one, and how do you choose λ?</p>
  <table class="tb"><thead><tr><th></th><th>Ridge</th><th>Lasso</th></tr></thead><tbody>
  <tr><td class="nm">Penalty</td><td>λ Σ b²</td><td>λ Σ |b|</td></tr>
  <tr><td class="nm">Coefficients reach zero?</td><td>No, only close</td><td>Yes, exactly</td></tr>
  <tr><td class="nm">Selects features?</td><td>No</td><td>Yes, that is the point</td></tr>
  <tr><td class="nm">With correlated features</td><td>Shares the credit between them, stably</td><td>Picks one somewhat arbitrarily and drops the rest</td></tr>
  <tr><td class="nm">Use it when</td><td>You think most features matter a bit</td><td>You think most features matter not at all</td></tr>

  <div class="note blue"><b>λ is not something you reason your way to.</b> You fit the model at thirty or so values of λ, score each by cross-validation, and keep the one with the best held-out error. Lesson 4's rule applies here exactly: the training error will always prefer λ = 0, and the training error is not the thing you care about.</div>`},
