/* --- t distribution, so every p-value and interval on this page is computed, not typed --- */
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,
 -1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
 let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;
 for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x)}
function betacf(a,b,x){const EPS=3e-12,FPMIN=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;
 if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;
 for(let m=1;m<=300;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));
  d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;
  aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
  d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;
  const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break}
 return h}
function ibeta(a,b,x){if(x<=0)return 0;if(x>=1)return 1;
 const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
 return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
const tTwoSided=(t,df)=>ibeta(df/2,0.5,df/(df+t*t));               /* P(|T| > |t|) */
function tInv(p,df){let lo=0,hi=60;for(let i=0;i<200;i++){const m=(lo+hi)/2;
 (1-tTwoSided(m,df)/1<p?lo=m:hi=m)}return (lo+hi)/2}
const tCrit=df=>{let lo=0,hi=60;for(let i=0;i<200;i++){const m=(lo+hi)/2;
 if(tTwoSided(m,df)>0.05)lo=m;else hi=m}return (lo+hi)/2};

const PQ=(()=>{
 const x=SHOP.map(s=>s.ad),y=SHOP.map(s=>s.sales),n=x.length,df=n-2;
 const m=ols(x.map(v=>[v]),y);
 const p=[0,1].map(i=>tTwoSided(Math.abs(m.t[i]),df));
 const tc=tCrit(df);
 const se=Math.sqrt(m.rss/df);
 const F=m.t[1]**2;
 return {n,df,b0:m.beta[0],b1:m.beta[1],se0:m.se[0],se1:m.se[1],t0:m.t[0],t1:m.t[1],
   p0:p[0],p1:p[1],r2:m.r2,ar2:m.ar2,resse:se,F,tc,
   lo1:m.beta[1]-tc*m.se[1],hi1:m.beta[1]+tc*m.se[1],
   lo0:m.beta[0]-tc*m.se[0],hi0:m.beta[0]+tc*m.se[0],

/* --- question banks --- */
const QVAR=[
 ['A hospital wants to know whether <b>length of stay</b> can be predicted from a patient’s <b>age on admission</b>. Which role does <b>age</b> play?','x','Age is the predictor you already have before the outcome is known. It goes on the horizontal axis.'],
 ['Same study. Which role does <b>length of stay</b> play?','y','It is the thing being predicted, so it is the dependent variable and goes on the vertical axis.'],
 ['A shop owner asks whether <b>weekly advertising spend</b> explains <b>weekly sales</b>. Which role does <b>sales</b> play?','y','Sales is the outcome the owner cares about and wants to predict.'],
 ['A university models <b>first-year GPA</b> from <b>hours studied per week</b>. Which role does <b>hours studied</b> play?','x','Hours studied is the input. Note that nobody randomised it, so this is still an association.'],
 ['An airline models <b>on-time percentage</b> using <b>average turnaround time</b>. Which role does <b>turnaround time</b> play?','x','Turnaround time is the explanatory variable here, even though in another study it could easily be the outcome.'],
 ['A clinic models <b>number of no-shows</b> from <b>days between booking and appointment</b>. Which role does <b>number of no-shows</b> play?','y','No-shows is the response being explained.'],
 ['In the equation ŷ = b₀ + b₁x, which role does <b>ŷ</b> play?','y','ŷ, read "y-hat", is the predicted value of the dependent variable. The plain y is what actually happened.'],
 ['A manager says "I want to see whether store size drives revenue." Which variable belongs on the <b>vertical axis</b>?','y','Revenue, the thing being explained. The variable doing the explaining always goes across the bottom.']];

const QSLOPE=[
 {q:'A regression of monthly electricity cost ($) on square footage gives <b>b₁ = 0.18</b>. What does 0.18 mean?',
  o:['Each extra square foot goes with about $0.18 more monthly cost','Cost is 18% of square footage','18% of the variation in cost is explained by size','Each extra dollar of cost goes with 0.18 more square feet'],a:0,
  why:'A slope is "change in y per one-unit change in x", and it carries the units of y divided by the units of x — here, dollars per square foot.'},
 {q:'A regression of length of stay (days) on age (years) gives <b>b₁ = 0.043</b>. Which statement is best?',
  o:['Each extra year of age goes with 0.043 more days of stay, about an hour','Older patients stay 4.3% longer','Age explains 4.3% of length of stay','Each extra day of stay adds 0.043 years of age'],a:0,
  why:'Keep the units attached. 0.043 days is roughly one hour — a useful reminder that a real, detectable slope can still be a trivially small effect.'},
 {q:'A regression of weekly sales ($) on advertising spend ($) gives <b>b₀ = 3,981</b>. What does the intercept mean?',
  o:['Predicted weekly sales for a shop that spends nothing on advertising','The average weekly sales across all shops','The lowest weekly sales in the data','The share of sales caused by advertising'],a:0,
  why:'The intercept is the fitted value at x = 0. Whether it means anything in business terms depends on whether x = 0 is realistic and inside the range of the data.'},
 {q:'The smallest advertising budget in that data is $200. How much should you trust the intercept as a real business quantity?',
  o:['Not much — x = 0 is outside the range of the data, so it is an extrapolation','Completely — it comes straight from the fitted equation','Only if R² is above 0.9','Not at all — it should be removed from the model'],a:0,
  why:'The intercept is needed to position the line, so keep it. Just be careful quoting it as a fact about a shop that has never existed in your data.'},
 {q:'Advertising is re-expressed in <b>thousands</b> of dollars instead of dollars. What happens to the slope?',
  o:['It is multiplied by 1,000','It is divided by 1,000','It does not change','It changes sign'],a:0,
  why:'A one-unit change in x is now a thousand times bigger, so the predicted change in y per unit is a thousand times bigger. The line itself, R² and the p-value are all unchanged — only the number’s units moved.'},
 {q:'A slope comes out <b>negative</b> with p = 0.002. What have you learned?',
  o:['There is strong evidence of a downward relationship in this data','The model is wrong, slopes cannot be negative','The two variables are unrelated','The dependent variable was chosen incorrectly'],a:0,
  why:'A negative slope is perfectly ordinary: as x rises, y tends to fall. The small p-value says that pattern is unlikely to be chance alone.'},
 {q:'Which of these can a simple regression slope <b>not</b> tell you?',
  o:['That changing x would cause y to change','The direction of the association','The predicted change in y per unit of x','The units the relationship is measured in'],a:0,
  why:'Causation comes from how the data were produced — randomisation, or a design that rules out the alternatives — never from the arithmetic of the fit.'},
 {q:'Two analysts fit the same relationship. One reports a slope of 3.61, the other 0.00361. Both are right. Why?',
  o:['They measured the variables in different units','One of them made an arithmetic error','One used a log transform','One of them had more data'],a:0,
  why:'Slopes carry units. Dollars versus thousands of dollars on either axis shifts the number by factors of a thousand without changing the relationship at all.'}];

const QP=[
 {q:'A slope has <b>p &lt; 0.0001</b>. What exactly is small?',
  o:['The chance of seeing a slope this far from zero if the true slope were really zero','The chance that the true slope is zero','The chance that the model is wrong','The size of the slope'],a:0,
  why:'A p-value is computed <em>assuming</em> the null is true. It is the probability of data at least this extreme under that assumption — not the probability that the assumption itself is right.'},
 {q:'What is the <b>null hypothesis</b> for the slope in a simple regression?',
  o:['β₁ = 0 — there is no linear relationship in the population','β₁ &gt; 0','b₁ = 0 — the fitted slope is zero','R² = 0 in the sample'],a:0,
  why:'The hypothesis is always about β₁, the unknown population slope. It is never about b₁, which you already calculated and can see is not zero.'},
 {q:'Using the usual 5% level, a slope comes back with <b>p = 0.03</b>. What do you conclude?',
  o:['Reject the null — there is evidence of a linear relationship','Fail to reject — 0.03 is small, so the slope is close to zero','The slope is 3% likely to be right','97% of the variation is explained'],a:0,
  why:'p below your chosen level means reject. Nothing about 0.03 tells you the relationship is large or important — only that it is distinguishable from zero.'},
 {q:'A different study reports a slope of 3.61 with <b>p = 0.42</b>. What is the right conclusion?',
  o:['There is not enough evidence to say the slope differs from zero','The slope is zero','The slope is 42% likely to be correct','The relationship must be negative'],a:0,
  why:'Failing to reject is not proof of no effect. With a small or noisy sample a perfectly real relationship can easily produce p = 0.42.'},
 {q:'Which sentence reports a significant slope correctly?',
  o:['"Advertising spend is significantly associated with weekly sales (p &lt; 0.001)."','"Advertising spend significantly causes weekly sales (p &lt; 0.001)."','"There is a 99.9% chance advertising affects sales."','"The slope is proven to be 3.61."'],a:0,
  why:'Say "associated with" unless something was randomised, attach the p-value, and never turn it into a probability that the effect is real.'},
 {q:'Your residual plot has a clear curve in it. Should you still quote the p-value?',
  o:['No — the straight-line model is wrong, so everything computed from it is answering the wrong question','Yes, the p-value does not depend on the residuals','Yes, as long as R² is high','Only if the sample is large'],a:0,
  why:'The p-value is calculated under the model’s assumptions. If the relationship bends and your model is a straight line, fix the model first and read the output afterwards.'}];

const QR2=[
 {q:'R² = 0.716 for sales on advertising. What does that mean?',
  o:['About 72% of the variation in sales is accounted for by the line','The model is correct 72% of the time','72% of shops are predicted exactly right','Advertising causes 72% of sales'],a:0,
  why:'R² compares the error your line leaves behind with the error you would have had using the flat average of y. It is a share of variation, not a hit rate.'},
 {q:'What is R² for a line that predicts no better than the average of y?',
  o:['0','1','0.5','Undefined'],a:0,
  why:'R² = 1 − SSE/SST. If your line leaves the same error as the mean does, SSE = SST and R² = 0.'},
 {q:'In a <b>simple</b> regression, how are R² and the correlation r related?',
  o:['R² = r²','R² = r','R² = |r| ÷ 2','They are unrelated'],a:0,
  why:'With one predictor they are the same information in two forms. r = −0.85 and r = +0.85 both give R² = 0.72, which is why R² alone never tells you the direction.'},
 {q:'A model of human behaviour gets R² = 0.18. Is that bad?',
  o:['Not necessarily — in some settings that is a real finding worth acting on','Yes, anything under 0.5 is useless','Yes, it means the slope cannot be significant','Only if the p-value is also large'],a:0,
  why:'R² has no universal threshold. Human behaviour is noisy; a well-identified 0.18 can be worth more than a 0.95 fitted to a trending time series.'},
 {q:'A high R² and a small p-value together prove that x causes y. True?',
  o:['False — neither number says anything about causation','True, that is what significance means','True if R² is above 0.9','True only for experiments'],a:0,
  why:'Both numbers describe how well a line fits the data you happen to have. Whether x causes y is decided by how the data were produced, not by the fit.'}];

const QTRAP=[
 {q:'Advertising and sales move together with p &lt; 0.0001. A manager concludes that doubling the ad budget will double sales. What is wrong?',
  o:['Nothing was randomised, so the association may be driven by something else entirely','The p-value is too small to trust','R² was not reported','The slope should have been negative'],a:0,
  why:'In this data busier locations both advertise more and sell more, so location is doing part of the work the slope gets credited for. A significant slope in observational data is an association, full stop.'},
 {q:'The largest advertising budget in the data is $2,800. The owner asks for a prediction at $9,000. What do you say?',
  o:['That is extrapolation — the data says nothing about what happens out there','Multiply the slope by 9,000 and add the intercept','It is fine as long as R² is high','Report it but round it heavily'],a:0,
  why:'A straight line describes the range you observed. Outside it the real relationship almost certainly bends — advertising saturates — and the model has no way to know that.'},
 {q:'You swap the variables and regress advertising on sales instead. What happens to the fitted line?',
  o:['It changes — regressing y on x is a different problem from x on y','Nothing, the line is the same','Only the intercept changes','R² changes but the slope does not'],a:0,
  why:'Least squares minimises vertical distances to whichever variable you called y. Correlation is symmetric; regression is not. Choosing the outcome is a modelling decision, not a formatting one.'},
 {q:'One shop has an enormous budget and enormous sales, far from everything else. What should you do?',
  o:['Look at it, fit the model with and without it, and report what changed','Delete it — outliers are always errors','Keep it and say nothing — removing data is cheating','Transform y until it disappears'],a:0,
  why:'A single far-out point can swing a simple regression on its own. The honest move is to show both fits and say which conclusions depend on that one observation.'},
 {q:'A correlation of 0.85 is reported with no scatterplot. What could you still be missing?',
  o:['A curve, a single point driving the whole thing, or two separate groups','Nothing — 0.85 fully describes the relationship','The p-value','The sample size'],a:0,
  why:'Anscombe’s quartet is the classic demonstration: four datasets with identical slopes and correlations that look nothing like each other. Always plot the data.'},
 {q:'A study finds ice cream sales predict drowning deaths, p &lt; 0.001. What is going on?',
  o:['Both rise in summer — a third variable is behind the relationship','Ice cream is dangerous','The p-value must be wrong','The variables were entered the wrong way round'],a:0,
  why:'The textbook confounder. The line fits, the p-value is tiny, and the story is nonsense — because temperature drives both and was never in the model.'},
 {q:'Your model is fitted on 60 shops in one city. The owner wants to apply it to a shop in another country. What is the risk?',
  o:['The relationship was estimated on a particular group and may not hold elsewhere','The slope will change sign','R² will automatically fall to zero','None, a fitted line is universal'],a:0,
  why:'A regression describes the population it was fitted on. Costs, customers and competition differ elsewhere, and nothing in the output warns you when you have left that population.'}];

/* --- questions about the printed output --- */
const QOUT=[
 {q:'Which number in the table is the <b>slope</b>?',
  o:['3.6056, on the Ad spend row','3,980.65, on the Intercept row','0.7159','60'],a:0,
  why:'The slope sits on the row named after the predictor. The Intercept row holds the constant term, and 0.7159 is R².'},
 {q:'Which number is the <b>intercept</b>?',
  o:['3,980.65','3.6056','0.7159','&lt; 0.0001'],a:0,
  why:'The intercept is the coefficient on the row labelled Intercept. It is the predicted value of y when x is zero.'},
 {q:'Write the fitted line from this table. What is it?',
  o:['ŷ = 3,980.65 + 3.6056x','ŷ = 3.6056 + 3,980.65x','ŷ = 3,980.65 × 3.6056x','ŷ = 0.7159x'],a:0,
  why:'Intercept first, then slope times x. Getting these two the wrong way round is the single most common slip in reading output.'},
 {q:'Using that line, what are predicted weekly sales for a shop spending <b>$2,000</b> on advertising?',
  o:['About $11,200','About $7,200','About $3,981','About $5,980'],a:0,
  why:'3,980.65 + 3.6056 × 2,000 = 3,980.65 + 7,211 = 11,192. The usual mistake is reporting only the slope term and forgetting the intercept.'},
 {q:'Which number tells you how much of the variation in sales the line accounts for?',
  o:['R² = 0.7159','The slope, 3.6056','The p-value','n = 60'],a:0,
  why:'R² is the share of the variation in y explained by the line. The slope tells you the rate; R² tells you how tightly the points follow it.'},
 {q:'The p-value on the Ad spend row is <b>less than 0.0001</b>. What does that let you say?',
  o:['There is strong evidence that the true slope is not zero','Advertising causes 72% of sales','The prediction will be accurate to within 0.0001','The model fits almost perfectly'],a:0,
  why:'A small p-value means the slope is distinguishable from zero. It says nothing about how big the effect is, how well the line fits, or what causes what.'},
 {q:'A classmate writes: "p &lt; 0.0001, so advertising explains almost all of sales." What is wrong?',
  o:['The p-value says the slope is not zero; R² says how much is explained, and it is 0.72','Nothing is wrong','A p-value and an R² can never be discussed together','p &lt; 0.0001 is impossible with n = 60'],a:0,
  why:'Significance and strength answer different questions. A tiny p-value next to an R² of 0.05 is routine in large samples: a real relationship that explains very little.'}];

E.q1={id:'q1',title:'Practice: simple linear regression',
 lead:'Forty-one questions on one model with one predictor: naming the variables, reading the output, saying a coefficient out loud, deciding what a p-value does and does not mean, and the traps that catch people whose arithmetic was perfectly correct. Answer before you click — your first answer is the one that counts.',
 learn:[
 {html:()=>`${(PQTOTAL=0,PQS={n:0,c:0},'')}<div class="stats" id="pqscore" style="margin:0 0 6px"></div>
  <div class="note"><b>How to use this.</b> Work down the page. Every question explains why the right answer is right, so a wrong first click is worth more than a lucky one. Only your first answer on each question counts toward the score.</div>
  <div class="row"><button class="vb" id="pqreset">Start the quiz over</button></div>`,
  init:()=>{pqTally();$('pqreset').onclick=()=>render('practice')}},

 {html:()=>`<p class="q">1. Which variable is which?</p>
  <p>Before any arithmetic, decide what you are predicting and what you are predicting it from. The dependent variable — <b>y</b>, the response, the outcome — goes on the vertical axis. The independent variable — <b>x</b>, the predictor, the explanatory variable — goes across the bottom.</p>
  ${pqSort('qv',QVAR,{y:'Dependent (y)',x:'Independent (x)'})}`,
  init:()=>pqSortBind('qv',QVAR,{y:'Dependent (y)',x:'Independent (x)'})},

 {html:()=>`<p class="q">2. Read the output.</p>
  <p>Below is the output for a simple regression of <b>weekly sales</b> on <b>weekly advertising spend</b>, fitted on the 60 coffee shops used throughout this site. Every number is computed in your browser from the data. Click a row to see what it is telling you.</p>
  <div class="fig"><div class="tbw"><table class="tb" id="pqout"></table></div>
   <div id="pqexp" class="note" style="margin:12px 0 0">Click a row of the table.</div>
   <figcaption><b>Output.</b> Simple linear regression, n = ${PQ.n} shops. Synthetic data, real arithmetic.</figcaption></div>
  <div class="eqn">ŷ = <span class="v">${PQ.b0.toFixed(2)}</span> + <span class="v">${PQ.b1.toFixed(4)}</span> × ad spend
   <small>Read it as: a shop spending nothing on advertising is predicted to sell about $${Math.round(PQ.b0).toLocaleString()} a week, and each extra dollar of weekly advertising goes with about $${PQ.b1.toFixed(2)} more in weekly sales, among shops like these.</small></div>
  ${pq('qo',QOUT)}`,
  init:()=>{
   const rows=[
    {k:'Intercept',c:PQ.b0.toFixed(2),p:pfmt(PQ.p0),
     e:'<b>Intercept (b₀) = '+PQ.b0.toFixed(2)+'.</b> The predicted weekly sales of a shop that spends nothing on advertising. The smallest budget in this data is $200, so x = 0 sits outside the observed range — the number is needed to position the line, but do not quote it as a business fact.'},
    {k:'Ad spend',c:PQ.b1.toFixed(4),p:pfmt(PQ.p1),
     e:'<b>Slope (b₁) = '+PQ.b1.toFixed(4)+'.</b> Each extra dollar of weekly advertising goes with about $'+PQ.b1.toFixed(2)+' more in weekly sales, among shops like these. The p-value underneath 0.0001 says a slope this far from zero would be very unlikely if there were really no relationship — but it says nothing about <em>how big</em> the effect is, and nothing about cause.'}];
   const foot=[
    ['R²',PQ.r2.toFixed(4),'<b>R² = '+PQ.r2.toFixed(4)+'.</b> The line accounts for about '+(PQ.r2*100).toFixed(0)+'% of the variation in weekly sales. In a simple regression this is exactly the square of the correlation between x and y, which is why it never tells you the direction on its own.'],
    ['Observations',String(PQ.n),'<b>n = '+PQ.n+' shops.</b> One row of the dataset per shop. Sample size does not appear in the fitted line, but it drives how much the slope would bounce around if you collected a different 60 shops — and therefore how small the p-value is.']];
   $('pqout').innerHTML=
    '<thead><tr><th>Term</th><th style="text-align:right">Coefficient</th><th style="text-align:right">p-value</th></tr></thead><tbody>'+
    rows.map((r,i)=>`<tr data-e="${i}" style="cursor:pointer"><td class="nm">${r.k}</td><td class="n">${r.c}</td><td class="n" style="color:var(--ok);font-weight:600">${r.p}</td></tr>`).join('')+
    foot.map((f,i)=>`<tr data-e="${i+2}" style="cursor:pointer"><td class="nm" style="color:var(--grey)">${f[0]}</td><td class="n" colspan="2" style="text-align:left;color:var(--ink-2)">${f[1]}</td></tr>`).join('')+
    '</tbody>';
   const exp=[...rows.map(r=>r.e),...foot.map(f=>f[2])];
   $('pqout').querySelectorAll('tr[data-e]').forEach(tr=>tr.onclick=()=>{
     $('pqout').querySelectorAll('tr[data-e]').forEach(o=>o.style.background='');
     tr.style.background='var(--accent-soft)';
     $('pqexp').innerHTML=exp[+tr.dataset.e]});
   pqBind('qo',QOUT)}},

 {html:()=>`<p class="q">3. Say the coefficient out loud.</p>
  <p>Most marks are lost here, not in the arithmetic. A coefficient has a direction, a size, and a pair of units, and a good sentence carries all three without claiming more than the data supports.</p>
  ${pq('qs',QSLOPE)}`, init:()=>pqBind('qs',QSLOPE)},

 {html:()=>`<p class="q">4. p-values and significance.</p>
  <p>One question, asked four ways: is the slope distinguishable from zero, and what are you allowed to say once you decide that it is?</p>
  ${pq('qp',QP)}`, init:()=>pqBind('qp',QP)},

 {html:()=>`<p class="q">5. R² and how well the line fits.</p>
  ${pq('qr',QR2)}`, init:()=>pqBind('qr',QR2)},

 {html:()=>`<p class="q">6. The traps.</p>
  <p>These are the ones that survive a perfectly correct calculation. Each has caught a real analyst, usually in a deck that had already been presented.</p>
  ${pq('qt',QTRAP)}`, init:()=>pqBind('qt',QTRAP)},

 {html:()=>`<p class="q">One page of reminders.</p>
  <table class="tb"><tbody>
  <tr><td class="nm">Dependent, y</td><td>What you are predicting. Vertical axis. Chosen by you, not by the data.</td></tr>
  <tr><td class="nm">Independent, x</td><td>What you are predicting from. Horizontal axis.</td></tr>
  <tr><td class="nm">ŷ</td><td>The predicted value from the line. Plain y is what actually happened.</td></tr>
  <tr><td class="nm">b₀, intercept</td><td>Predicted y when x = 0. Meaningful only if x = 0 is realistic and inside the range of the data.</td></tr>
  <tr><td class="nm">b₁, slope</td><td>Change in y per one-unit change in x, in the units of y per unit of x. Say "goes with", not "causes", unless something was randomised.</td></tr>
  <tr><td class="nm">p-value</td><td>The chance of a slope at least this far from zero <em>if the true slope were zero</em>. Small means the slope is distinguishable from zero — not that it is large, and not that x causes y.</td></tr>
  <tr><td class="nm">R²</td><td>Share of the variation in y accounted for by the line. Equals r² in simple regression. No universal threshold for "good".</td></tr>
  <tr><td class="nm">Prediction</td><td>ŷ = b₀ + b₁x, and only for values of x inside the range you actually observed.</td></tr>
  </tbody></table>
  <div class="note red"><b>The three sentences that lose marks.</b> "The p-value is the probability the null is true." "R² of 0.72 means the model is right 72% of the time." "A significant slope means x causes y." None of those is true, and all three turn up every semester.</div>`}]};

render(CUR);
</script>
